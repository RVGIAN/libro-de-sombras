  function renderDetalle(p) {
    const detalle = document.getElementById('altar-detalle');
    if (!detalle) return;

    // Parsear elementos del altar (formato: emoji|nombre|posición)
    const elementos = p.elementos
      ? p.elementos.split('\n').filter(Boolean).map(line => {
          const parts = line.split('|');
          return { emoji: parts[0] || '✨', nombre: parts[1] || '', pos: parts[2] || '' };
        })
      : [];

    detalle.innerHTML = `
      <div class="card">
        <div class="flex-between mb-1">
          <h2>${p.name}</h2>
          <button class="btn-icon" onclick="Altar._seleccionar('${p.id}')">✕</button>
        </div>
        ${p.img ? `<img src="${p.img}" style="width:100%;max-height:200px;object-fit:cover;border-radius:var(--radius-s);margin-bottom:1rem"
          onerror="this.style.display='none'" alt="${p.name}">` : ''}
        ${p.desc ? `<p style="color:var(--lavender);font-size:.9rem;margin-bottom:1rem">${p.desc}</p>` : ''}
        ${elementos.length > 0
          ? `<h3 style="margin-bottom:.75rem">Elementos del altar</h3>
             ${elementos.map(e => `
               <div class="altar-elem">
                 <span class="altar-elem-emoji">${e.emoji}</span>
                 <div>
                   <div class="altar-elem-nombre">${e.nombre}</div>
                   <div class="altar-elem-pos">${e.pos}</div>
                 </div>
               </div>`).join('')}`
          : `<p class="text-muted" style="font-size:.88rem">No hay elementos definidos para este altar aún.</p>`}
        ${Admin.isUnlocked()
          ? `<div style="margin-top:1rem">
              <button class="btn btn-ghost btn-sm"
                onclick="Admin._panteonNuevo('${p.id}');App.navigate('admin');Admin._showPanel('altar')">
                ✏️ Editar panteón
              </button>
            </div>` : ''}
      </div>`;
  }

  return { render, _seleccionar };
})();

   ANCESTROS.JS — Registro de ancestros, espíritus y seres
   Tipos: Ancestro/a · Deidad · Guía · Espíritu · Elemental
          Demonio/Daimón · Ángel · Hada · Otro
   ============================================================ */

const Ancestros = (() => {
  const TIPOS = [
    { key: 'todos',    label: 'Todos',          emoji: '✨' },
    { key: 'ancestro', label: 'Ancestros',       emoji: '👤' },
    { key: 'deidad',   label: 'Deidades',        emoji: '🌟' },
    { key: 'guia',     label: 'Guías',           emoji: '🔮' },
    { key: 'espiritu', label: 'Espíritus',       emoji: '👁️' },

  TIPOS.forEach(t => { TIPO_EMOJI[t.key] = t.emoji; });

  let filtroActivo = 'todos';

  function render() {

    if (!sec) return;

    sec.innerHTML = `
      <h1 class="section-title">👁️ Ancestros & Espíritus</h1>

      </div>
      <div id="anc-rituales" class="tab-panel">

  function renderRegistro() {
    const ancestros = App.lsGet('bruja_ancestros', []);

    // Filtros de tipo
    const filtroHTML = `
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem" id="anc-filtros">
        ${TIPOS.map(t => `
          <button class="btn btn-ghost btn-sm ${filtroActivo===t.key?'active':''}"
            onclick="Ancestros._filtrar('${t.key}', this)">
            ${t.emoji} ${t.label}
          </button>`).join('')}
      </div>`;

    if (ancestros.length === 0) {
      return filtroHTML + `<div class="empty-state">
        <span class="es-emoji">👁️</span>
        <p>Comienza registrando ancestros, guías, deidades o espíritus desde Admin.</p>
        ${Admin.isUnlocked() ? `<button class="btn btn-ghost" onclick="App.navigate('admin');Admin._showPanel('ancestros')">Ir a Admin</button>` : ''}
      </div>`;
    }

    const filtrados = filtroActivo === 'todos'
      ? ancestros

    return filtroHTML + (filtrados.length === 0
      ? `<p class="text-muted text-center mt-2">No hay entradas de este tipo aún.</p>`
      : filtrados.map(a => entradaCard(a)).join(''));
  }

  function entradaCard(a) {
    const tipo = a.tipo || 'ancestro';
    const em = TIPO_EMOJI[tipo] || '✨';
    const tipoLabel = TIPOS.find(t => t.key === tipo)?.label || tipo;
    return `
      <div class="ancestro-card" style="cursor:pointer" onclick="Ancestros._ver('${a.id}')">
        ${a.img

          </div>
          ${a.rel ? `<div class="ancestro-rel">${a.rel}</div>` : ''}

            ? `<div style="font-size:.75rem;color:var(--muted)">
                ${a.nac ? `🌱 ${a.nac}` : ''}
                ${a.nac && a.partida ? ' — ' : ''}
                ${a.partida ? `✨ ${a.partida}` : ''}
               </div>` : ''}
        </div>

  function renderRituales() {
    const rituales = App.lsGet('bruja_rituales_ancestros', []);
    const textosLibro = [
      {
        titulo: '🕯️ Ritual de Conexión con los Ancestros',
        desc: 'Un espacio sagrado para honrar a quienes caminaron antes que tú.',
        pasos: [
          'Prepara un altar limpio con fotografías o nombres de tus ancestros.',
          'Enciende una vela blanca o dorada en su honor.',
          'Coloca un vaso de agua fresca como ofrenda.',
          'Siéntate en silencio y llama mentalmente a tus ancestros con amor.',

          'Escribe una carta a un ancestro o ser específico.',

      },
      {
        titulo: '🔮 Invocación de Guías y Espíritus',
        desc: 'Para conectar con guías, elementales, deidades o cualquier ser de tu práctica.',

          'Pronuncia su nombre tres veces con respeto e intención clara.',

  function renderOfrendas() {
    const ancestros = App.lsGet('bruja_ancestros', []);
    const todas = ancestros.flatMap(a =>
      a.ofrendas ? a.ofrendas.split(',').map(o => ({ entidad: a.name, ofrenda: o.trim(), tipo: a.tipo || 'ancestro' })) : []

    if (todas.length === 0) {
      return `

    }

    const porEntidad = {};
    todas.forEach(({ entidad, ofrenda, tipo }) => {
      if (!porEntidad[entidad]) porEntidad[entidad] = { ofrendas: [], tipo };
      porEntidad[entidad].ofrendas.push(ofrenda);
    });

    return Object.entries(porEntidad).map(([nombre, { ofrendas, tipo }]) => `
      <div class="card">
        <div class="card-title">${TIPO_EMOJI[tipo] || '✨'} ${nombre}</div>
        <div style="display:flex;flex-wrap:wrap;gap:.4rem">
          ${ofrendas.map(o => `<span class="badge badge-gold">${o}</span>`).join('')}

  function _tab(key, btn) {
    document.querySelectorAll('#anc-tabs .tab-btn').forEach(b => b.classList.remove('active'));

    document.querySelectorAll('#sec-ancestros .tab-panel').forEach(p => p.classList.remove('active'));

  function _filtrar(tipo, btn) {

    document.querySelectorAll('#anc-filtros .btn').forEach(b => b.classList.remove('active'));

  function _ver(id) {
    const ancestros = App.lsGet('bruja_ancestros', []);

    const tipo = a.tipo || 'ancestro';

      ${a.historia ? `
        <div class="bib-prop mt-2">
          <div class="bib-prop-label">📖 Historia / Descripción</div>
          <div class="bib-prop-value" style="color:var(--lavender);line-height:1.75">${a.historia.replace(/\n/g,'<br>')}</div>
        </div>` : ''}`,
      { showCancel: false, confirmLabel: 'Cerrar', onConfirm: () => {} }
    );
  }

  return { render, _tab, _filtrar, _ver };
})();

/* ============================================================
   RUEDA.JS — Rueda del Año con selector de hemisferio
   ============================================================ */

const Rueda = (() => {
  let hemisferio = App.lsGet('bruja_hemisferio', 'norte');

  function render() {
    const sec = document.getElementById('sec-rueda');
    if (!sec) return;

    const sabats = App.lsGet('bruja_sabats', Admin.getDefaultSabats());

    sec.innerHTML = `
      <h1 class="section-title">☀️ Rueda del Año</h1>
      <p class="section-sub">Las ocho festividades del ciclo solar.</p>

      <div class="hemisferio-toggle">
        <button class="hemi-btn ${hemisferio === 'norte' ? 'active' : ''}"
          onclick="Rueda._setHemi('norte', this)">🌍 Hemisferio Norte</button>
        <button class="hemi-btn ${hemisferio === 'sur' ? 'active' : ''}"
          onclick="Rueda._setHemi('sur', this)">🌏 Hemisferio Sur</button>
      </div>

      <div id="rueda-sabats"></div>`;

    renderSabats(sabats);
  }

  function renderSabats(sabats) {
    const container = document.getElementById('rueda-sabats');
    if (!container) return;

    // Ordenar por fecha del hemisferio seleccionado
    const sorted = [...sabats].sort((a, b) => {
      const fa = hemisferio === 'norte' ? (a.fecha_n || '12-31') : (a.fecha_s || '12-31');
      const fb = hemisferio === 'norte' ? (b.fecha_n || '12-31') : (b.fecha_s || '12-31');
      return fa.localeCompare(fb);
    });

    const hoy = new Date();
    const mmdd = String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');

    container.innerHTML = sorted.map(s => {
      const fecha = hemisferio === 'norte' ? (s.fecha_n || '') : (s.fecha_s || '');
      const esPasado = fecha && fecha < mmdd;
      const esProximo = !esPasado && fecha && Math.abs(diasHasta(fecha)) <= 14;

      return `
        <div class="card" style="cursor:pointer;${esPasado ? 'opacity:.6' : ''}" onclick="Rueda._toggle('${s.id}')">
          <div class="flex-between">
            <div class="card-title">
              ${s.emoji || '☀️'} ${s.name}
              ${esProximo ? `<span class="badge badge-gold" style="margin-left:.4rem">Próximo</span>` : ''}
            </div>
            <span style="font-size:.82rem;color:var(--muted)">${formatFecha(fecha)}</span>
          </div>
          <div id="rueda-det-${s.id}" style="display:none">
            <hr class="section-divider">
            ${s.desc ? `<p style="font-size:.9rem;color:var(--lavender)">${s.desc}</p>` : ''}
            ${s.rituales ? `
              <div class="bib-prop mt-1">
                <div class="bib-prop-label">🕯️ Rituales & Prácticas</div>
                <div class="bib-prop-value">${s.rituales.replace(/\n/g,'<br>')}</div>
              </div>` : ''}
            ${Admin.isUnlocked() ? `
              <button class="btn btn-ghost btn-sm mt-2"
                onclick="event.stopPropagation();Admin._sabatNuevo('${s.id}');App.navigate('admin');Admin._showPanel('rueda')">
                ✏️ Editar
              </button>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function diasHasta(mmdd) {
    const hoy = new Date();
    const año = hoy.getFullYear();
    const [m, d] = mmdd.split('-').map(Number);
    let fecha = new Date(año, m - 1, d);
    if (fecha < hoy) fecha = new Date(año + 1, m - 1, d);
    return Math.round((fecha - hoy) / (1000 * 60 * 60 * 24));
  }

  function formatFecha(mmdd) {
    if (!mmdd) return '';
    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const [m, d] = mmdd.split('-').map(Number);
    return `${d} ${meses[m - 1] || ''}`;
  }

  function _setHemi(h, btn) {
    hemisferio = h;
    App.lsSet('bruja_hemisferio', h);
    document.querySelectorAll('.hemi-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const sabats = App.lsGet('bruja_sabats', Admin.getDefaultSabats());
    renderSabats(sabats);
  }

  function _toggle(id) {
    const det = document.getElementById('rueda-det-' + id);
    if (det) det.style.display = det.style.display === 'none' ? 'block' : 'none';
  }

  return { render, _setHemi, _toggle };
})();

</script>

          ${s.etiquetas ? `<div style="margin-top:1rem;display:flex;flex-wrap:wrap;gap:.3rem">
            ${s.etiquetas.split(',').map(e => `<span class="badge badge-purple">${e.trim()}</span>`).join('')}
          </div>` : ''}
        </div>
      </div>
      <!-- Navegación -->
      <div style="display:flex;justify-content:space-between;margin-top:.75rem">
        <button class="btn btn-ghost btn-sm" ${idx <= 0 ? 'disabled' : ''}
          onclick="Diario._navSlide(-1)">← Anterior</button>
        <span style="font-size:.8rem;color:var(--muted)">${idx + 1} / ${slides.length}</span>
        <button class="btn btn-ghost btn-sm" ${idx >= slides.length - 1 ? 'disabled' : ''}
          onclick="Diario._navSlide(1)">Siguiente →</button>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:.5rem">
        <button class="btn btn-ghost btn-sm" onclick="Diario._editarSlide('${s.id}')">✏️ Editar</button>
        <button class="btn btn-danger btn-sm" onclick="Diario._eliminarSlide('${s.id}')">🗑️ Eliminar</button>
      </div>`;
  }

  function _abrirSlide(id) {
    slideActivo = id;
    vistaActiva = 'slide';
    // Mostrar el botón de slide en la barra
    const btn = document.getElementById('btn-slide-view');
    if (btn) { btn.style.display = 'inline-flex'; btn.classList.add('active'); }
    // Cambiar vista
    document.getElementById('diario-galeria')?.classList.add('hidden');
    const sv = document.getElementById('diario-slide-view');
    if (sv) {
      sv.classList.remove('hidden');
      const slides = App.lsGet('bruja_diario', []);
      sv.innerHTML = renderSlide(slides.find(s => s.id === id));
    }
  }

  function _vista(v, btn) {
    vistaActiva = v;
    document.querySelectorAll('#sec-diario .btn.btn-ghost.btn-sm').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (v === 'grid') {
      document.getElementById('diario-galeria')?.classList.remove('hidden');
      document.getElementById('diario-slide-view')?.classList.add('hidden');
    } else {
      document.getElementById('diario-galeria')?.classList.add('hidden');
      document.getElementById('diario-slide-view')?.classList.remove('hidden');
    }
  }

  function _navSlide(dir) {
    const slides = App.lsGet('bruja_diario', []);
    const idx = slides.findIndex(s => s.id === slideActivo);
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= slides.length) return;
    slideActivo = slides[newIdx].id;
    const sv = document.getElementById('diario-slide-view');
    if (sv) sv.innerHTML = renderSlide(slides[newIdx]);
  }

  function _nuevaPagina(id = null) {
    const slides = App.lsGet('bruja_diario', []);
    const item = id ? slides.find(s => s.id === id) : {};
    const isEdit = !!id;

    App.openModal(isEdit ? 'Editar página' : 'Nueva página del diario', `
      <div class="form-group">
        <label class="form-label">Título</label>
        <input id="dj-titulo" class="form-input" value="${item.titulo || ''}" placeholder="Título de la página">
      </div>
      <div class="form-group">
        <label class="form-label">Fecha</label>
        <input id="dj-fecha" class="form-input" type="date" value="${item.fecha || App.todayISO()}">
      </div>
      <div class="form-group">
        <label class="form-label">Imagen — URL GitHub</label>
        <input id="dj-img" class="form-input" value="${item.img || ''}" placeholder="https://...">
      </div>
      <div class="form-group">
        <label class="form-label">Contenido</label>
        <textarea id="dj-contenido" class="form-textarea" style="min-height:140px"
          placeholder="Tu entrada del diario…">${item.contenido || ''}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Etiquetas (separadas por coma)</label>
        <input id="dj-etiquetas" class="form-input" value="${item.etiquetas || ''}"
          placeholder="Ej: luna llena, ritual, intención">
      </div>`,
      {
        confirmLabel: isEdit ? 'Guardar' : 'Crear página',
        onConfirm: () => {
          const nuevo = {
            id: id || App.uid(),
            titulo: document.getElementById('dj-titulo')?.value.trim(),
            fecha: document.getElementById('dj-fecha')?.value,
            img: document.getElementById('dj-img')?.value.trim(),
            contenido: document.getElementById('dj-contenido')?.value.trim(),
            etiquetas: document.getElementById('dj-etiquetas')?.value.trim(),
          };
          const list = App.lsGet('bruja_diario', []);
          if (isEdit) {
            const i = list.findIndex(x => x.id === id);
            if (i >= 0) list[i] = nuevo; else list.push(nuevo);
          } else {
            list.unshift(nuevo); // insertar al inicio
            slideActivo = nuevo.id;
          }
          App.lsSet('bruja_diario', list);
          App.toast(isEdit ? 'Página actualizada ✓' : 'Página creada ✓');
          render(); // re-render completo
          if (!isEdit) {
            setTimeout(() => _abrirSlide(nuevo.id), 100);
          }
        }
      }
    );
  }

  function _editarSlide(id) {
    _nuevaPagina(id);
  }

  function _eliminarSlide(id) {
    if (!confirm('¿Eliminar esta página? No se puede deshacer.')) return;
    const list = App.lsGet('bruja_diario', []).filter(s => s.id !== id);
    App.lsSet('bruja_diario', list);
    App.toast('Página eliminada');
    slideActivo = list.length > 0 ? list[0].id : null;
    vistaActiva = 'grid';
    render();
  }

  return { render, _abrirSlide, _vista, _navSlide, _nuevaPagina, _editarSlide, _eliminarSlide };
})();

</script>

    const display = document.getElementById('tarot-display');
    if (!display) return;

    if (t.cartas === 1) {
      const c = seleccionadas[0];
      display.innerHTML = `
        <div class="tarot-card-img" style="${c.invertida?'transform:rotate(180deg)':''}">
          ${imgs[c.num]
            ? `<img src="${imgs[c.num]}" alt="${c.nombre}" onerror="this.outerHTML='<div class=tarot-card-emoji>${c.emoji}</div>'">`
            : `<div class="tarot-card-emoji">${c.emoji}</div>`}
        </div>
        <h2>${c.nombre} ${c.invertida?'<span style="font-size:.7rem;color:var(--muted)">(invertida)</span>':''}</h2>
        <p style="color:var(--gold-l);font-size:.88rem">${c.clave}</p>`;
    } else {
      const posiciones = tiradaActual === 'cruz' ? POSICIONES_CRUZ :
                         tiradaActual === 'tres' ? ['Pasado', 'Presente', 'Futuro'] :
                         seleccionadas.map((_, i) => 'Carta ' + (i+1));

      display.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:.75rem">
          ${seleccionadas.map((c, i) => `
            <div style="text-align:center">
              <div style="font-size:2.2rem;${c.invertida?'transform:rotate(180deg);display:inline-block':''}">
                ${imgs[c.num]
                  ? `<img src="${imgs[c.num]}" alt="${c.nombre}"
                      style="width:70px;height:auto;border-radius:6px;${c.invertida?'transform:rotate(180deg)':''}"
                      onerror="this.outerHTML='${c.emoji}'">`
                  : c.emoji}
              </div>
              <div style="font-size:.7rem;color:var(--gold-l);margin-top:.3rem">${posiciones[i] || ''}</div>
              <div style="font-size:.78rem;font-family:var(--font-heading)">${c.nombre}</div>
              ${c.invertida ? '<div style="font-size:.65rem;color:var(--muted)">invertida</div>' : ''}
            </div>`).join('')}
        </div>`;
    }
  }

  function _tirarRunas() {
    const t = TIRADAS_RUNAS.find(x => x.id === tiradaRuna);
    if (!t) return;

    const shuffled = [...RUNAS].sort(() => Math.random() - 0.5);
    const seleccionadas = shuffled.slice(0, t.cartas).map(r => ({
      ...r, invertida: r.num !== 24 && Math.random() > 0.65 // Wyrd no invierte
    }));

    const display = document.getElementById('runas-display');
    if (!display) return;

    const posiciones = tiradaRuna === 'nornas' ? POS_NORNAS :
                       tiradaRuna === 'cinco'  ? POS_CINCO  :
                       tiradaRuna === 'tres'   ? ['Pasado', 'Presente', 'Futuro'] :
                       [''];

    if (t.cartas === 1) {
      const r = seleccionadas[0];
      display.innerHTML = `
        <div style="font-size:4rem;font-family:serif;${r.invertida?'transform:rotate(180deg);display:inline-block':''}">
          ${r.sim}
        </div>
        <h2>${r.nombre} ${r.invertida?'<span style="font-size:.7rem;color:var(--muted)">(invertida)</span>':''}</h2>
        <p style="color:var(--gold-l);font-size:.88rem">${r.clave}</p>`;
    } else {
      display.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.75rem">
          ${seleccionadas.map((r, i) => `
            <div style="text-align:center;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem">
              <div style="font-size:2.5rem;font-family:serif;${r.invertida?'transform:rotate(180deg);display:inline-block':''}">${r.sim}</div>
              <div style="font-size:.68rem;color:var(--gold-l);margin-top:.3rem">${posiciones[i] || ''}</div>
              <div style="font-size:.82rem;font-family:var(--font-heading);margin:.2rem 0">${r.nombre}</div>
              <div style="font-size:.7rem;color:var(--muted);line-height:1.4">${r.clave}</div>
              ${r.invertida ? '<div style="font-size:.65rem;color:var(--muted)">invertida</div>' : ''}
            </div>`).join('')}
        </div>`;
    }
  }

  function _limpiar() {
    const display = document.getElementById('tarot-display');
    if (display) display.innerHTML = '<p class="text-muted">Presiona el botón para tirar las cartas</p>';
  }

  function _limpiarRunas() {
    const display = document.getElementById('runas-display');
    if (display) display.innerHTML = '<p class="text-muted">Presiona el botón para sacar las runas</p>';
  }

  return { render, _tabPrincipal, _setTirada, _tirar, _limpiar, _setTiradaRuna, _tirarRunas, _limpiarRunas };
})();

  <script>
'use strict';
// ============================================================
// CARTA.JS — Carta natal: formulario + render SVG
// ============================================================
const CartaModule = (() => {

  let currentChart = null;
  const STORAGE_KEY = 'bruja_natal_data';

  // ── Coordenadas ciudad → lat/lon (ciudades principales) ───
  const CITIES = {
    'Quito, Ecuador':          [-0.23,  -78.52],
    'Guayaquil, Ecuador':      [-2.17,  -79.92],
    'Cuenca, Ecuador':         [-2.90,  -79.00],
    'Bogotá, Colombia':        [ 4.71,  -74.07],
    'Lima, Perú':              [-12.05, -77.04],
    'Buenos Aires, Argentina': [-34.61, -58.38],
    'Santiago, Chile':         [-33.45, -70.67],
    'Ciudad de México':        [ 19.43, -99.13],
    'Caracas, Venezuela':      [ 10.49, -66.88],
    'Medellín, Colombia':      [  6.25, -75.56],
    'Madrid, España':          [ 40.42,  -3.70],
    'Nueva York, USA':         [ 40.71, -74.01],
    'Miami, USA':              [ 25.77, -80.19],

    'Cairo, Egipto':           [ 30.05,  31.23],
    'Lagos, Nigeria':          [  6.46,   3.38],
  };

  // ── UTC offsets por ciudad (horas, negativo = oeste de UTC) ─
  const UTC_OFFSETS = {
    'Quito, Ecuador': -5, 'Guayaquil, Ecuador': -5, 'Cuenca, Ecuador': -5,
    'Bogotá, Colombia': -5, 'Lima, Perú': -5, 'Medellín, Colombia': -5,
    'Ciudad de Panamá': -5, 'San José, Costa Rica': -6,
    'Buenos Aires, Argentina': -3, 'Montevideo, Uruguay': -3,
    'Santiago, Chile': -4, 'La Paz, Bolivia': -4, 'Asunción, Paraguay': -4,
    'Ciudad de México': -6, 'Caracas, Venezuela': -4,
    'São Paulo, Brasil': -3, 'Río de Janeiro, Brasil': -3,
    'Madrid, España': 1, 'Nueva York, USA': -5, 'Miami, USA': -5,
    'Tokio, Japón': 9, 'Pekín, China': 8, 'Mumbai, India': 5.5,
    'Cairo, Egipto': 2, 'Lagos, Nigeria': 1,
  };

  // ── Render SVG de la carta ────────────────────────────────
  function renderChart(chart) {
    const wrap = document.getElementById('carta-svg-wrap');
    if (!wrap) return;
    wrap.innerHTML = '';

    const size = 480;
    const cx = size / 2, cy = size / 2;
    const R = {
      outer: 220, zodiac: 200, houseOuter: 165, houseInner: 145,
      planets: 110, center: 60,
    };

    const svg = createSVG(size);

    // Fondo
    addDef(svg, cx, cy, R);

    // Fondo oscuro
    const bgCircle = el('circle', { cx, cy, r: R.outer + 4, fill: '#0A0818' });
    svg.appendChild(bgCircle);

    // Círculos de delimitación
    [[R.outer,'#2A2048',1],[R.zodiac,'#3A3060',1],[R.houseOuter,'#2A2048',.7],
     [R.houseInner,'#3A3060',.7],[R.center,'#2A2048',.5]].forEach(([r,col,op])=>{
      svg.appendChild(el('circle',{cx,cy,r,fill:'none',stroke:col,
        'stroke-width':.7,'stroke-opacity':op}));
    });

    // Símbolos del zodíaco
    Astro.ZODIAC.forEach((sign, i) => {
      const angle = (i * 30 - chart.asc + 90) * Math.PI / 180;
      const r = (R.zodiac + R.outer) / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);

      // Sector de fondo por elemento
      const elColors = { fuego:'rgba(255,107,53,.1)', tierra:'rgba(123,158,58,.1)',
                         aire:'rgba(168,216,234,.1)', agua:'rgba(74,144,217,.1)' };
      const sectorPath = sectorArc(cx,cy,R.zodiac,R.outer, (i*30-chart.asc)*Math.PI/180,
                                   ((i+1)*30-chart.asc)*Math.PI/180);
      const sectorEl = el('path',{d:sectorPath,fill:elColors[sign.el]||'transparent'});
      svg.insertBefore(sectorEl, svg.firstChild.nextSibling);

      // Divisor de signo
      const divAngle = (i * 30 - chart.asc + 90) * Math.PI / 180;
      const lx1 = cx + R.zodiac * Math.cos(divAngle - Math.PI/2);
      const ly1 = cy + R.zodiac * Math.sin(divAngle - Math.PI/2);
      const lx2 = cx + R.outer * Math.cos(divAngle - Math.PI/2);
      const ly2 = cy + R.outer * Math.sin(divAngle - Math.PI/2);
      svg.appendChild(el('line',{x1:lx1,y1:ly1,x2:lx2,y2:ly2,
        stroke:'#3A3060','stroke-width':.5}));

      // Símbolo del signo
      const sym = el('text',{ x:x, y:y,
        fill:Astro.EL_COLORS[sign.el]||'#D8C8F0',
        'font-size':'13','text-anchor':'middle',
        'dominant-baseline':'middle','font-family':'serif' });
      sym.textContent = sign.sym;
      svg.appendChild(sym);
    });

    // Líneas de casas
    for(let h=0;h<12;h++){
      const houseAngle = (chart.houses[h] - chart.asc + 90) * Math.PI / 180;
      const isAngular = h%3===0;
      const x1 = cx + R.houseInner * Math.cos(houseAngle);
      const y1 = cy + R.houseInner * Math.sin(houseAngle);
      const x2 = cx + R.houseOuter * Math.cos(houseAngle);
      const y2 = cy + R.houseOuter * Math.sin(houseAngle);
      svg.appendChild(el('line',{x1,y1,x2,y2,
        stroke: isAngular ? '#B8860B' : '#2A2048',
        'stroke-width': isAngular ? 1.5 : .5}));

      // Número de casa
      const mr = (R.houseOuter + R.houseInner) / 2;
      const midAngle = (chart.houses[h] - chart.asc + 15 + 90) * Math.PI / 180;
      const hx = cx + mr * Math.cos(midAngle);
      const hy = cy + mr * Math.sin(midAngle);
      const ht = el('text',{x:hx,y:hy,fill:'#5A5080','font-size':'9',
        'text-anchor':'middle','dominant-baseline':'middle','font-family':'sans-serif'});
      ht.textContent = h+1;
      svg.appendChild(ht);
    }

    // Ejes ASC/DSC y MC/IC
    [[chart.asc,'ASC','#B8860B'],[chart.asc+180,'DSC','#8B6600'],
     [chart.MC,'MC','#4A90D9'],[chart.MC+180,'IC','#2A6090']].forEach(([lon,lbl,col])=>{
      const a = (lon - chart.asc + 90) * Math.PI / 180;
      const ax1 = cx + R.houseInner * Math.cos(a);
      const ay1 = cy + R.houseInner * Math.sin(a);
      const ax2 = cx + R.houseOuter * Math.cos(a);
      const ay2 = cy + R.houseOuter * Math.sin(a);
      svg.appendChild(el('line',{x1:ax1,y1:ay1,x2:ax2,y2:ay2,
        stroke:col,'stroke-width':2}));
      const lx = cx + (R.houseOuter+8) * Math.cos(a);
      const ly = cy + (R.houseOuter+8) * Math.sin(a);
      const lt = el('text',{x:lx,y:ly,fill:col,'font-size':'8',
        'text-anchor':'middle','dominant-baseline':'middle','font-weight':'bold','font-family':'sans-serif'});
      lt.textContent = lbl;
      svg.appendChild(lt);
    });

    // Líneas de aspecto (en el centro)
    const aspects = Astro.calcAspects(chart.pos);
    aspects.slice(0,15).forEach(asp=>{
      const a1 = (chart.pos[asp.p1] - chart.asc + 90) * Math.PI / 180;
      const a2 = (chart.pos[asp.p2] - chart.asc + 90) * Math.PI / 180;
      const x1 = cx + R.planets * Math.cos(a1);
      const y1 = cy + R.planets * Math.sin(a1);
      const x2 = cx + R.planets * Math.cos(a2);
      const y2 = cy + R.planets * Math.sin(a2);
      const line = el('line',{x1,y1,x2,y2,
        stroke: asp.asp.color, 'stroke-width':.6,'stroke-opacity':.4});
      svg.insertBefore(line, svg.children[5]);
    });

    // Planetas
    const PLANET_KEYS = ['SUN','MOON','MERCURY','VENUS','MARS','JUPITER','SATURN','URANUS','NEPTUNE','PLUTO','LILITH','NNODE'];
    PLANET_KEYS.forEach(key => {
      const data = chart.signs[key];
      if (!data) return;
      const angle = (data.lon - chart.asc + 90) * Math.PI / 180;
      const px = cx + R.planets * Math.cos(angle);
      const py = cy + R.planets * Math.sin(angle);

      // Punto del planeta
      svg.appendChild(el('circle',{cx:px,cy:py,r:12,
        fill: 'rgba(13,11,30,.8)', stroke: data.info.color, 'stroke-width':1.2}));

      // Símbolo
      const psym = el('text',{x:px,y:py,fill:data.info.color,
        'font-size':'11','text-anchor':'middle','dominant-baseline':'middle','font-family':'serif'});
      psym.textContent = data.info.sym;
      svg.appendChild(psym);

      // Línea al anillo
      const lAngle = angle;
      const lx1 = cx + (R.planets+13)*Math.cos(lAngle);
      const ly1 = cy + (R.planets+13)*Math.sin(lAngle);
      const lx2 = cx + (R.houseInner-2)*Math.cos(lAngle);
      const ly2 = cy + (R.houseInner-2)*Math.sin(lAngle);
      svg.insertBefore(el('line',{x1:lx1,y1:ly1,x2:lx2,y2:ly2,
        stroke:data.info.color,'stroke-width':.5,'stroke-opacity':.5}), svg.lastChild);
    });

    // Centro: símbolo del sol
    const centerText = el('text',{x:cx,y:cy,fill:'rgba(255,215,0,.2)',
      'font-size':'28','text-anchor':'middle','dominant-baseline':'middle','font-family':'serif'});
    centerText.textContent = '☉';
    svg.appendChild(centerText);

    wrap.appendChild(svg);
  }

  function sectorArc(cx,cy,r1,r2,a1,a2){
    const x1=cx+r2*Math.cos(a1-Math.PI/2), y1=cy+r2*Math.sin(a1-Math.PI/2);
    const x2=cx+r2*Math.cos(a2-Math.PI/2), y2=cy+r2*Math.sin(a2-Math.PI/2);
    const x3=cx+r1*Math.cos(a2-Math.PI/2), y3=cy+r1*Math.sin(a2-Math.PI/2);
    const x4=cx+r1*Math.cos(a1-Math.PI/2), y4=cy+r1*Math.sin(a1-Math.PI/2);
    return `M${x1},${y1} A${r2},${r2} 0 0,1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 0,0 ${x4},${y4} Z`;
  }

  function createSVG(size){
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox',`0 0 ${size} ${size}`);
    svg.setAttribute('width','100%');
    svg.setAttribute('height','100%');
    return svg;
  }

  function el(tag, attrs){
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
    return e;
  }

  function addDef(svg, cx, cy, R){
    const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
    const grad = document.createElementNS('http://www.w3.org/2000/svg','radialGradient');
    grad.id='bgGrad'; grad.setAttribute('cx','50%'); grad.setAttribute('cy','50%');
    const s1=document.createElementNS('http://www.w3.org/2000/svg','stop');
    s1.setAttribute('offset','0%'); s1.setAttribute('stop-color','#161228');
    const s2=document.createElementNS('http://www.w3.org/2000/svg','stop');
    s2.setAttribute('offset','100%'); s2.setAttribute('stop-color','#0A0818');
    grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad);
    svg.appendChild(defs);
  }

  // ── Render tabla de planetas ───────────────────────────────
  function renderPlanetTable(chart) {
    const wrap = document.getElementById('planeta-tabla');
    if (!wrap) return;
    const keys = ['SUN','MOON','MERCURY','VENUS','MARS','JUPITER','SATURN','URANUS','NEPTUNE','PLUTO','LILITH','NNODE'];
    wrap.innerHTML = keys.map(k => {
      const d = chart.signs[k];
      if(!d) return '';
      return `<div class="planet-row">
        <span class="planet-sym" style="color:${d.info.color}">${d.info.sym}</span>
        <span class="planet-name">${d.info.name}</span>
        <span class="planet-sign">${d.sign.sym} ${d.sign.name}</span>
        <span class="planet-deg">${d.deg}°${String(d.min).padStart(2,'0')}'</span>
      </div>`;
    }).join('');
  }

  // ── Render aspectos ───────────────────────────────────────
  function renderAspects(chart){
    const wrap = document.getElementById('aspectos-lista');
    if(!wrap) return;
    const aspects = Astro.calcAspects(chart.pos).slice(0,12);
    wrap.innerHTML = aspects.map(a=>`
      <div class="asp-row">
        <span class="asp-sym" style="color:${a.asp.color}">${a.asp.sym}</span>
        <span class="asp-name">${a.asp.name}</span>
        <span class="asp-planets">
          ${Astro.PLANETS[a.p1]?.sym||''} ${Astro.PLANETS[a.p1]?.name||a.p1}
          —
          ${Astro.PLANETS[a.p2]?.sym||''} ${Astro.PLANETS[a.p2]?.name||a.p2}
        </span>
      </div>`).join('');
  }

  // ── Render interpretaciones ───────────────────────────────
  const INTERPS = {
    SUN:     s=>`Tu esencia, tu propósito vital y tu fuerza de vida funcionan en modo <strong>${s}</strong>. Es el combustible de tu vitalidad.`,
    MOON:    s=>`Emocionalmente, tu instinto responde desde <strong>${s}</strong>. Así nutres, así necesitas ser nutrido/a.`,
    MERCURY: s=>`Tu mente, comunicación y forma de procesar el mundo vibran en <strong>${s}</strong>.`,
    VENUS:   s=>`En amor y estética, atraes y amas en modo <strong>${s}</strong>. Lo que valoras lleva este sello.`,
    MARS:    s=>`Tu fuerza, deseo y acción se mueven al ritmo de <strong>${s}</strong>. Así peleas, logras y deseas.`,
    JUPITER: s=>`Tu expansión y abundancia naturales crecen mejor a través de <strong>${s}</strong>. Aquí está tu suerte.`,
    SATURN:  s=>`Saturno en <strong>${s}</strong> marca tus lecciones más profundas y dónde construyes autoridad genuina.`,
    URANUS:  s=>`Tu generación reforma el mundo usando la energía de <strong>${s}</strong>. Es tu sello de ruptura.`,
    NEPTUNE: s=>`Tu espiritualidad y visión transpersonal se tiñen de <strong>${s}</strong>. Es la niebla de tu era.`,
    PLUTO:   s=>`Plutón en <strong>${s}</strong> es la transformación generacional de tu tiempo. Fuerza de cambio colectivo.`,
    LILITH:  s=>`Tu Lilith en <strong>${s}</strong> señala el poder instintivo que aprendiste a suprimir — y que espera integrarse.`,
    NNODE:   s=>`Tu Nodo Norte en <strong>${s}</strong> marca la dirección de evolución de esta vida.`,
  };

  function renderInterpretaciones(chart){
    const wrap = document.getElementById('interp-wrap');
    if(!wrap) return;
    const main=['SUN','MOON','MERCURY','VENUS','MARS','JUPITER','SATURN'];
    const asc = chart.ascSign;
    let html = `<div class="interp-card" style="border-color:rgba(184,134,11,.4);margin-bottom:.75rem">
      <div class="interp-planet">🌅 Ascendente — ${asc.sym} ${asc.name}</div>
      <p class="interp-text">Tu máscara social, cómo el mundo te percibe al primer encuentro. También la puerta de entrada a tu vida. Ascendente en <strong>${asc.name}</strong>: llegas al mundo con la energía de ${asc.el} y el estilo ${asc.mode}.</p>
    </div>`;
    main.forEach(k=>{
      const d=chart.signs[k]; if(!d) return;
      const fn=INTERPS[k]; if(!fn) return;
      html+=`<div class="interp-card">
        <div class="interp-planet">${d.info.sym} ${d.info.name} en ${d.sign.sym} ${d.sign.name}</div>
        <p class="interp-text">${fn(d.sign.name)}</p>
      </div>`;
    });
    wrap.innerHTML=html;
  }

  // ── Carta natal de Gianfranco (posiciones exactas) ───────
  // Fuente: carta natal calculada con efemérides reales
  const GIANFRANCO = {
    pos: {
      SUN:159.27, MOON:61.52, MERCURY:170.85, VENUS:173.38,
      MARS:60.73, JUPITER:33.02, SATURN:289.0,
      URANUS:275.0, NEPTUNE:281.0, PLUTO:225.0,
      LILITH:76.0, NNODE:338.5,
    },
    asc:28.95, MC:119.18,
  };

  function buildPresetChart(preset) {
    const { pos, asc, MC } = preset;
    const ZOD = Astro.ZODIAC;
    const PLAN = Astro.PLANETS;
    // Casas aproximadas (Equal House desde ASC)
    const houses = Array.from({length:12},(_,i)=>((asc + i*30)%360+360)%360);
    const signs={};
    for(const [k,v] of Object.entries(pos)){
      const idx=Math.floor(((v%360)+360)%360/30);
      const lon=((v%360)+360)%360;
      const deg=lon%30;
      signs[k]={lon,sign:ZOD[idx],deg:Math.floor(deg),min:Math.floor((deg%1)*60),info:PLAN[k]||{sym:'?',color:'#999',name:k}};
    }
    return {pos,signs,asc,MC,houses,
      ascSign:ZOD[Math.floor(((asc%360)+360)%360/30)],
      mcSign:ZOD[Math.floor(((MC%360)+360)%360/30)]};
  }

  // ── Cargar carta de Gianfranco (preset exacto) ────────────
  function loadMyChart() {
    const result = document.getElementById('carta-result');
    if(result) result.classList.remove('hidden');
    const summ = document.getElementById('carta-summary');
    if(summ){
      summ.innerHTML = `
        <span class="text-gold">☉</span> Sol en <strong>Virgo</strong>
        &nbsp;·&nbsp;
        <span class="text-gold">☽</span> Luna en <strong>Géminis</strong>
        &nbsp;·&nbsp;
        <span class="text-gold">↑</span> Ascendente <strong>Aries</strong>
        <br><small class="text-muted">Gianfranco · Carta natal (efemérides exactas)</small>`;
    }
    currentChart = buildPresetChart(GIANFRANCO);
    renderChart(currentChart);
    renderPlanetTable(currentChart);
    renderAspects(currentChart);
    renderInterpretaciones(currentChart);
  }

  // ── Inicializar sección ───────────────────────────────────
  function init() {
    const form = document.getElementById('carta-form');
    if (!form) return;

    // Llenar selector de ciudades
    const citySelect = document.getElementById('city-select');
    if(citySelect){
      Object.keys(CITIES).forEach(c=>{
        const opt=document.createElement('option');
        opt.value=c; opt.textContent=c;
        if(c.includes('Quito')) opt.selected=true;
        citySelect.appendChild(opt);
      });
    }

    // Botón "Mi Carta" (preset exacto)
    const presetBtn = document.getElementById('btn-mi-carta');
    if(presetBtn){
      presetBtn.addEventListener('click', loadMyChart);
    }

    // Cargar datos guardados
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
      if(saved){
        ['birth-name','birth-date','birth-time'].forEach(id=>{
          const el=document.getElementById(id);
          if(el&&saved[id]) el.value=saved[id];
        });
        if(saved.city && citySelect){
          citySelect.value=saved.city;
          if(!citySelect.value) citySelect.value='Quito, Ecuador';
        }
      }
    }catch(e){}

    form.addEventListener('submit', e => {
      e.preventDefault();
      calcChart();
    });

    // Auto-cargar carta de Gianfranco al abrir la sección
    loadMyChart();
  }

  function calcChart(){
    const dateVal = document.getElementById('birth-date')?.value;
    const timeVal = document.getElementById('birth-time')?.value || '12:00';
    const city    = document.getElementById('city-select')?.value || 'Quito, Ecuador';
    const name    = document.getElementById('birth-name')?.value || '';

    if (!dateVal) return;

    const [yr,mo,dy] = dateVal.split('-').map(Number);
    const [hrLocal,mn] = timeVal.split(':').map(Number);
    const [lat,lon]  = CITIES[city] || [-0.23,-78.52];

    // ── Convertir hora local → UTC ────────────────────────────
    // offset = horas de diferencia vs UTC (ej. Quito = -5)
    // UTC = hora_local - offset  (si offset=-5: UTC = local+5)
    const offset = UTC_OFFSETS[city] ?? -5;
    let utcHr = hrLocal - offset;
    let utcDy = dy, utcMo = mo, utcYr = yr;

    // Manejar desbordamiento de horas
    const DAYS_IN_MONTH = [0,31,28,31,30,31,30,31,31,30,31,30,31];
    const isLeap = (utcYr%4===0 && utcYr%100!==0) || utcYr%400===0;
    if (isLeap) DAYS_IN_MONTH[2] = 29;

    if (utcHr >= 24) {
      utcHr -= 24; utcDy++;
      if (utcDy > DAYS_IN_MONTH[utcMo]) { utcDy = 1; utcMo++; }
      if (utcMo > 12) { utcMo = 1; utcYr++; }
    } else if (utcHr < 0) {
      utcHr += 24; utcDy--;
      if (utcDy < 1) { utcMo--; if (utcMo < 1) { utcMo=12; utcYr--; } utcDy=DAYS_IN_MONTH[utcMo]; }
    }

    // Guardar
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        'birth-date':dateVal,'birth-time':timeVal,'city':city,'birth-name':name
      }));
    }catch(e){}

    currentChart = Astro.chartData(utcYr, utcMo, utcDy, utcHr, mn, lat, lon);

    // Mostrar resultado
    const result = document.getElementById('carta-result');
    if(result) result.classList.remove('hidden');

    // Resumen encabezado
    const summ = document.getElementById('carta-summary');
    if(summ){
      summ.innerHTML = `
        <span class="text-gold">☉</span> Sol en <strong>${currentChart.signs.SUN.sign.name}</strong>
        &nbsp;·&nbsp;
        <span class="text-gold">☽</span> Luna en <strong>${currentChart.signs.MOON.sign.name}</strong>
        &nbsp;·&nbsp;
        <span class="text-gold">↑</span> Ascendente <strong>${currentChart.ascSign.name}</strong>
        ${name ? `<br><small class="text-muted">${name}</small>` : ''}
      `;
    }

    renderChart(currentChart);
    renderPlanetTable(currentChart);
    renderAspects(currentChart);
    renderInterpretaciones(currentChart);

    // Scroll al resultado
    document.getElementById('carta-result')?.scrollIntoView({behavior:'smooth'});
  }

  return { init };
})();

// Alias para el nuevo sistema de navegación
const Carta = {
  render() {
    // La sección sec-carta ya tiene el HTML del módulo viejo si fue inicializado
    // Si no, inicializar
    const sec = document.getElementById('sec-carta');
    if (!sec) return;
    if (!sec.querySelector('#carta-form')) {
      CartaModule.init();
    }
  }
};
