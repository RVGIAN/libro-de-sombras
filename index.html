<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>El Año de la Bruja — Libro de Sombras</title>
  <meta name="description" content="Tu grimorio digital: biblioteca mágica, hechizos, altar, rueda del año, diario y más.">
  <meta name="theme-color" content="#07050F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   MAIN.CSS — El Año de la Bruja v3
   Variables administrables desde Admin via CSS custom props
   ============================================================ */

/* ── Tokens de diseño (editables desde Admin) ── */
:root {
  /* Colores base */
  --bg:        #07050F;
  --bg2:       #0F0A1E;
  --bg3:       #150E2A;
  --gold:      #C4972A;
  --gold-l:    #E8B84B;
  --gold-g:    #FFD966;
  --lavender:  #DDD0F5;
  --text:      #F0E8FF;
  --muted:     #7A6A9A;
  --border:    #221A42;
  --accent:    #4A0E8F;

  /* Tipografía (editables desde Admin) */
  --font-title:   'Cinzel Decorative', serif;
  --font-heading: 'Cinzel', serif;
  --font-body:    'Crimson Text', serif;
  --font-ui:      'Crimson Text', serif;
  --size-title:   1.6rem;
  --size-heading: 1.1rem;
  --size-body:    1rem;

  /* Radio y espaciado */
  --radius:  12px;
  --radius-s: 8px;
  --gap:     1rem;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--size-body);
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Tipografía ── */
h1, h2, h3 { line-height: 1.3; }
h1 { font-family: var(--font-title); font-size: var(--size-title); color: var(--gold); }
h2 { font-family: var(--font-heading); font-size: var(--size-heading); color: var(--gold-l); }
h3 { font-family: var(--font-heading); font-size: .95rem; color: var(--lavender); }
p  { margin-bottom: .75rem; }
a  { color: var(--gold-l); text-decoration: none; }
a:hover { color: var(--gold-g); }
strong { color: var(--gold-l); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ════════════════════════════════════════════
   LAYOUT PRINCIPAL
   ════════════════════════════════════════════ */

/* Barra de navegación superior */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(7,5,15,.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: .5rem .75rem;
}

#topbar-inner {
  display: flex;
  align-items: center;
  gap: .5rem;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding-bottom: 2px; /* evita corte de sombra */
}
#topbar-inner::-webkit-scrollbar { display: none; }

/* Logo compacto */
.topbar-logo {
  font-family: var(--font-title);
  font-size: .75rem;
  color: var(--gold);
  white-space: nowrap;
  margin-right: .25rem;
  flex-shrink: 0;
}

/* Píldoras de navegación */
.nav-pill {
  display: flex;
  align-items: center;
  gap: .3rem;
  background: rgba(196,151,42,.07);
  border: 1px solid rgba(196,151,42,.18);
  color: var(--muted);
  border-radius: 20px;
  padding: .28rem .75rem;
  font-size: .78rem;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
  flex-shrink: 0;
  user-select: none;
}
.nav-pill:hover {
  background: rgba(196,151,42,.15);
  border-color: var(--gold);
  color: var(--gold-l);
}
.nav-pill.active {
  background: rgba(196,151,42,.22);
  border-color: var(--gold);
  color: var(--gold-g);
  font-weight: 600;
}
.nav-pill .pill-emoji { font-size: .9rem; }

/* Botón Admin */
.nav-pill.admin-pill {
  background: rgba(74,14,143,.15);
  border-color: rgba(138,43,226,.3);
  color: var(--lavender);
  margin-left: auto;
  flex-shrink: 0;
}
.nav-pill.admin-pill:hover {
  background: rgba(74,14,143,.3);
  border-color: #8A2BE2;
  color: #fff;
}

/* Contenido principal */
#main {
  padding-top: 50px; /* altura del topbar */
  min-height: 100vh;
}

/* ── Pantalla de inicio ── */
#sec-home {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: calc(100vh - 50px);
  padding: 2rem 1rem 3rem;
}

.home-portada {
  width: 100%;
  max-width: 380px;
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 1.5rem;
  box-shadow: 0 8px 40px rgba(196,151,42,.18);
}
.home-portada img {
  width: 100%;
  display: block;
}
.home-portada-placeholder {
  width: 100%;
  aspect-ratio: 3/4;
  background: linear-gradient(160deg, var(--bg3), var(--accent));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
}
.home-portada-placeholder .ph-emoji { font-size: 4rem; }
.home-portada-placeholder h1 { font-size: 1.3rem; text-align: center; padding: 0 1rem; }

.home-info {
  text-align: center;
  max-width: 400px;
}
.home-info h2 { margin-bottom: .5rem; }
.home-fase {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  background: rgba(196,151,42,.08);
  border: 1px solid rgba(196,151,42,.2);
  border-radius: 20px;
  padding: .35rem .9rem;
  font-size: .85rem;
  color: var(--gold-l);
  margin-bottom: 1rem;
}

/* Dashboard rápido en home */
.home-dash {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .6rem;
  width: 100%;
  max-width: 400px;
  margin-top: 1.25rem;
}
.dash-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: .75rem;
  cursor: pointer;
  transition: border-color .2s;
}
.dash-card:hover { border-color: var(--gold); }
.dash-card .dc-emoji { font-size: 1.5rem; display: block; margin-bottom: .3rem; }
.dash-card .dc-label { font-family: var(--font-heading); font-size: .78rem; color: var(--gold-l); display: block; }
.dash-card .dc-value { font-size: .82rem; color: var(--muted); }

/* ── Secciones ── */
.section {
  display: none;
  padding: 1.5rem 1rem 3rem;
  max-width: 760px;
  margin: 0 auto;
  animation: fadeIn .25s ease;
}
.section.visible { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.section-title {
  font-family: var(--font-title);
  font-size: var(--size-title);
  color: var(--gold);
  margin-bottom: .3rem;
}
.section-sub {
  color: var(--muted);
  font-size: .88rem;
  margin-bottom: 1.5rem;
}
.section-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 1.25rem 0;
}

/* ════════════════════════════════════════════
   COMPONENTES
   ════════════════════════════════════════════ */

/* ── Card ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  margin-bottom: 1rem;
}
.card-title {
  font-family: var(--font-heading);
  font-size: .88rem;
  color: var(--gold-l);
  margin-bottom: .5rem;
  display: flex;
  align-items: center;
  gap: .4rem;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: .4rem;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
}
.tab-btn {
  background: rgba(196,151,42,.07);
  border: 1px solid rgba(196,151,42,.15);
  color: var(--muted);
  border-radius: 20px;
  padding: .3rem .8rem;
  font-size: .8rem;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all .2s;
}
.tab-btn:hover { border-color: var(--gold); color: var(--gold-l); }
.tab-btn.active {
  background: rgba(196,151,42,.18);
  border-color: var(--gold);
  color: var(--gold-g);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Formulario ── */
.form-group { margin-bottom: 1rem; }
.form-label {
  display: block;
  font-family: var(--font-heading);
  font-size: .78rem;
  color: var(--gold-l);
  margin-bottom: .3rem;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  color: var(--text);
  font-family: var(--font-body);
  font-size: .92rem;
  padding: .5rem .75rem;
  transition: border-color .2s;
  outline: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--gold);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-select option { background: var(--bg2); }

/* ── Botones ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  border: none;
  border-radius: 20px;
  padding: .45rem 1.1rem;
  font-family: var(--font-body);
  font-size: .88rem;
  cursor: pointer;
  transition: all .2s;
  line-height: 1;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold), var(--gold-l));
  color: #07050F;
  font-weight: 600;
}
.btn-primary:hover { opacity: .88; }
.btn-ghost {
  background: rgba(196,151,42,.08);
  border: 1px solid rgba(196,151,42,.2);
  color: var(--gold-l);
}
.btn-ghost:hover { background: rgba(196,151,42,.18); border-color: var(--gold); }
.btn-danger {
  background: rgba(180,30,30,.15);
  border: 1px solid rgba(180,30,30,.3);
  color: #ff7070;
}
.btn-danger:hover { background: rgba(180,30,30,.3); }
.btn-sm { padding: .28rem .7rem; font-size: .78rem; }
.btn-icon {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 1rem;
  padding: .2rem;
  transition: color .2s;
}
.btn-icon:hover { color: var(--gold-l); }

/* ── Badge ── */
.badge {
  display: inline-block;
  font-size: .68rem;
  font-family: var(--font-heading);
  padding: .15rem .5rem;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: .07em;
}
.badge-gold {
  background: rgba(196,151,42,.15);
  border: 1px solid rgba(196,151,42,.3);
  color: var(--gold);
}
.badge-purple {
  background: rgba(74,14,143,.2);
  border: 1px solid rgba(138,43,226,.3);
  color: var(--lavender);
}

/* ── Grid de tarjetas ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
@media (max-width: 480px) {
  .grid-3 { grid-template-columns: 1fr 1fr; }
}

/* ── Empty state ── */
.empty-state {
  text-align: center;
  padding: 2.5rem 1rem;
  color: var(--muted);
}
.empty-state .es-emoji { font-size: 2.5rem; display: block; margin-bottom: .75rem; }
.empty-state p { font-size: .9rem; margin-bottom: 1rem; }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn .2s ease;
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 1.5rem 1.25rem 2rem;
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
}
.modal-title { font-family: var(--font-heading); color: var(--gold-l); font-size: 1rem; }
.modal-close {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.3rem;
  cursor: pointer;
  line-height: 1;
}
.modal-close:hover { color: var(--text); }

/* ── Toast ── */
#toast-container {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  align-items: center;
  pointer-events: none;
}
.toast {
  background: var(--bg3);
  border: 1px solid var(--gold);
  color: var(--gold-l);
  padding: .5rem 1.1rem;
  border-radius: 20px;
  font-size: .85rem;
  font-family: var(--font-body);
  animation: toastIn .3s ease;
  pointer-events: none;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Upload de imagen ── */
.img-upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-s);
  padding: 1.25rem;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s;
  position: relative;
}
.img-upload-zone:hover { border-color: var(--gold); }
.img-upload-zone input[type=file] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}
.img-upload-zone .uz-icon { font-size: 1.8rem; display: block; margin-bottom: .4rem; }
.img-upload-zone .uz-text { font-size: .82rem; color: var(--muted); }
.img-preview {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: var(--radius-s);
  border: 1px solid var(--border);
}

/* ════════════════════════════════════════════
   SECCIÓN: BIBLIOTECA
   ════════════════════════════════════════════ */
.bib-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: .75rem;
}
.bib-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .2s, transform .15s;
}
.bib-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.bib-card-img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: var(--bg3);
}
.bib-card-img-ph {
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(135deg, var(--bg3), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
}
.bib-card-body { padding: .6rem .7rem; }
.bib-card-name {
  font-family: var(--font-heading);
  font-size: .82rem;
  color: var(--gold-l);
  margin-bottom: .2rem;
}
.bib-card-tags { display: flex; flex-wrap: wrap; gap: .25rem; }
.bib-tag {
  font-size: .65rem;
  background: rgba(196,151,42,.1);
  color: var(--muted);
  border-radius: 10px;
  padding: .1rem .4rem;
}

/* Detail panel */
.bib-detail {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem;
  margin-bottom: 1rem;
}
.bib-detail-img {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: var(--radius-s);
  margin-bottom: 1rem;
}
.bib-prop { margin-bottom: .6rem; }
.bib-prop-label {
  font-family: var(--font-heading);
  font-size: .72rem;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: .15rem;
}
.bib-prop-value { font-size: .9rem; color: var(--lavender); }

/* ════════════════════════════════════════════
   SECCIÓN: HECHIZOS
   ════════════════════════════════════════════ */
.hechizos-wrap { position: relative; }
.hechizo-fab {
  position: fixed;
  bottom: 1.5rem;
  right: 1rem;
  z-index: 50;
  background: linear-gradient(135deg, var(--accent), #7B4FBF);
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: .55rem 1rem;
  font-size: .82rem;
  font-family: var(--font-body);
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(74,14,143,.4);
  display: flex;
  align-items: center;
  gap: .4rem;
  transition: transform .2s;
}
.hechizo-fab:hover { transform: scale(1.05); }

.hechizo-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  margin-bottom: .75rem;
  cursor: pointer;
  transition: border-color .2s;
}
.hechizo-card:hover { border-color: var(--gold); }
.hechizo-card-header {
  display: flex;
  align-items: flex-start;
  gap: .75rem;
}
.hechizo-emoji { font-size: 1.8rem; flex-shrink: 0; }
.hechizo-info h3 { margin-bottom: .2rem; }
.hechizo-meta { font-size: .8rem; color: var(--muted); }
.hechizo-tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .5rem; }

/* Generator mini */
.gen-mini {
  background: rgba(74,14,143,.1);
  border: 1px solid rgba(138,43,226,.2);
  border-radius: var(--radius);
  padding: .9rem 1rem;
  margin-bottom: 1.25rem;
}
.gen-mini-title {
  font-family: var(--font-heading);
  font-size: .78rem;
  color: var(--lavender);
  margin-bottom: .6rem;
  display: flex;
  align-items: center;
  gap: .4rem;
}
.gen-mini-row {
  display: flex;
  gap: .5rem;
  align-items: center;
}
.gen-mini-row .form-input {
  flex: 1;
  padding: .4rem .7rem;
  font-size: .85rem;
}

/* ════════════════════════════════════════════
   SECCIÓN: ALTAR
   ════════════════════════════════════════════ */
.panteones-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: .75rem;
  margin-bottom: 1.5rem;
}
.panteон-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .2s, transform .15s;
  text-align: center;
}
.panteон-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.panteон-card.active { border-color: var(--gold); }
.panteон-img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: var(--bg3);
}
.panteон-img-ph {
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(135deg, var(--bg3), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
}
.panteон-name {
  font-family: var(--font-heading);
  font-size: .78rem;
  color: var(--gold-l);
  padding: .5rem;
}

.altar-detail { display: none; }
.altar-detail.visible { display: block; }

.altar-elem {
  display: flex;
  align-items: flex-start;
  gap: .75rem;
  padding: .6rem 0;
  border-bottom: 1px solid var(--border);
}
.altar-elem:last-child { border-bottom: none; }
.altar-elem-emoji { font-size: 1.5rem; flex-shrink: 0; }
.altar-elem-nombre { font-family: var(--font-heading); font-size: .85rem; color: var(--gold-l); margin-bottom: .2rem; }
.altar-elem-pos { font-size: .8rem; color: var(--muted); line-height: 1.5; }

/* ════════════════════════════════════════════
   SECCIÓN: RUEDA DEL AÑO
   ════════════════════════════════════════════ */
.hemisferio-toggle {
  display: flex;
  gap: .5rem;
  margin-bottom: 1.25rem;
}
.hemi-btn {
  flex: 1;
  text-align: center;
  padding: .4rem;
  border-radius: var(--radius-s);
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--muted);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: .85rem;
  transition: all .2s;
}
.hemi-btn.active {

  <!-- ══ SCRIPTS — orden de dependencias ══ -->
  <script>
/* ============================================================
   APP.JS — El Año de la Bruja v3
   Núcleo: navegación, utilidades, estado global
   ============================================================ */

const App = (() => {

  /* ── Configuración de secciones ── */
  const SECTIONS = [
    { id: 'home',       label: 'Inicio',       emoji: '🌙' },
    { id: 'biblioteca', label: 'Biblioteca',   emoji: '🌿' },
    { id: 'taller',     label: 'Taller',       emoji: '🕯️' },
    { id: 'hechizos',   label: 'Hechizos',     emoji: '✨' },
    { id: 'altar',      label: 'Altar',        emoji: '🔥' },
    { id: 'ancestros',  label: 'Ancestros',    emoji: '👁️' },
    { id: 'rueda',      label: 'Rueda del Año',emoji: '☀️' },
    { id: 'diario',     label: 'Diario',       emoji: '📖' },
    { id: 'tarot',      label: 'Tarot',        emoji: '🃏' },
    { id: 'libro',      label: 'El Libro',     emoji: '📚' },
    { id: 'carta',      label: 'Carta Astral', emoji: '⭐' },
  ];

  let currentSection = 'home';

  /* ── Renderizar topbar ── */
  function renderTopbar() {
    const inner = document.getElementById('topbar-inner');
    if (!inner) return;

    // Logo
    const logo = document.createElement('span');
    logo.className = 'topbar-logo';
    logo.textContent = '🌙';
    inner.appendChild(logo);

    // Pills de secciones
    SECTIONS.forEach(sec => {
      const pill = document.createElement('button');
      pill.className = 'nav-pill' + (sec.id === currentSection ? ' active' : '');
      pill.dataset.sec = sec.id;
      pill.innerHTML = `<span class="pill-emoji">${sec.emoji}</span>${sec.label}`;
      pill.addEventListener('click', () => navigate(sec.id));
      inner.appendChild(pill);
    });

    // Botón Admin
    const adminPill = document.createElement('button');
    adminPill.className = 'nav-pill admin-pill';
    adminPill.id = 'btn-admin-nav';
    adminPill.innerHTML = `<span class="pill-emoji">⚙️</span>Admin`;
    adminPill.addEventListener('click', () => navigate('admin'));
    inner.appendChild(adminPill);
  }

  /* ── Navegación ── */
  function navigate(sectionId) {
    currentSection = sectionId;

    // Ocultar todas las secciones
    document.querySelectorAll('.section').forEach(el => el.classList.remove('visible'));

    // Mostrar la sección activa
    const target = document.getElementById('sec-' + sectionId);
    if (target) {
      target.classList.add('visible');
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Actualizar pills activos
    document.querySelectorAll('.nav-pill').forEach(pill => {
      const sec = pill.dataset.sec;
      pill.classList.toggle('active', sec === sectionId);
    });

    // Desplazar la pill activa a la vista
    const activePill = document.querySelector(`.nav-pill[data-sec="${sectionId}"]`);
    if (activePill) {
      activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    // Inicializar la sección si tiene init()
    const moduleMap = {
      biblioteca: typeof Biblioteca !== 'undefined' ? Biblioteca : null,
      taller:     typeof Taller     !== 'undefined' ? Taller     : null,
      hechizos:   typeof Hechizos   !== 'undefined' ? Hechizos   : null,
      altar:      typeof Altar      !== 'undefined' ? Altar      : null,
      ancestros:  typeof Ancestros  !== 'undefined' ? Ancestros  : null,
      rueda:      typeof Rueda      !== 'undefined' ? Rueda      : null,
      diario:     typeof Diario     !== 'undefined' ? Diario     : null,
      tarot:      typeof Tarot      !== 'undefined' ? Tarot      : null,
      libro:      typeof Libro      !== 'undefined' ? Libro      : null,
      carta:      typeof Carta      !== 'undefined' ? Carta      : null,
      admin:      typeof Admin      !== 'undefined' ? Admin      : null,
    };

    const mod = moduleMap[sectionId];
    if (mod && typeof mod.render === 'function') {
      mod.render();
    }
  }

  /* ══════════════════════════════════════════════
     UTILIDADES GLOBALES
     ══════════════════════════════════════════════ */

  /* Toast */
  function toast(msg, duration = 2800) {
    let container = document.getElementById('toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toast-container';
      document.body.appendChild(container);
    }
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    container.appendChild(t);
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transition = 'opacity .3s';
      setTimeout(() => t.remove(), 350);
    }, duration);
  }

  /* Modal helper — abre un modal con contenido HTML */
  function openModal(titleText, bodyHTML, { onConfirm, confirmLabel = 'Guardar', showCancel = true } = {}) {
    let overlay = document.getElementById('global-modal');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'global-modal';
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-header">
            <span class="modal-title" id="gm-title"></span>
            <button class="modal-close" id="gm-close">✕</button>
          </div>
          <div id="gm-body"></div>
          <div id="gm-footer" style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;"></div>
        </div>`;
      document.body.appendChild(overlay);
    }

    document.getElementById('gm-title').textContent = titleText;
    document.getElementById('gm-body').innerHTML = bodyHTML;
    overlay.classList.remove('hidden');

    const footer = document.getElementById('gm-footer');
    footer.innerHTML = '';

    if (showCancel) {
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn-ghost btn-sm';
      cancelBtn.textContent = 'Cancelar';
      cancelBtn.onclick = closeModal;
      footer.appendChild(cancelBtn);
    }

    if (onConfirm) {
      const confirmBtn = document.createElement('button');
      confirmBtn.className = 'btn btn-primary btn-sm';
      confirmBtn.textContent = confirmLabel;
      confirmBtn.onclick = () => { onConfirm(); closeModal(); };
      footer.appendChild(confirmBtn);
    }

    document.getElementById('gm-close').onclick = closeModal;
    overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  }

  function closeModal() {
    const overlay = document.getElementById('global-modal');
    if (overlay) overlay.classList.add('hidden');
  }

  /* Leer imagen como base64 (para preview local) */
  function readImgFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* Fecha actual formateada */
  function today() {
    return new Date().toLocaleDateString('es-ES', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  /* Fecha ISO */
  function todayISO() {
    return new Date().toISOString().split('T')[0];
  }

  /* Generar ID único */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* localStorage helpers */
  function lsGet(key, def = null) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : def;
    } catch { return def; }
  }

  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }

  /* Aplicar tipografía guardada en Admin */
  function applyTypography() {
    const typo = lsGet('bruja_typo', {});
    const root = document.documentElement;
    if (typo.fontTitle)   root.style.setProperty('--font-title',   typo.fontTitle);
    if (typo.fontHeading) root.style.setProperty('--font-heading', typo.fontHeading);
    if (typo.fontBody)    root.style.setProperty('--font-body',    typo.fontBody);
    if (typo.sizeTitle)   root.style.setProperty('--size-title',   typo.sizeTitle);
    if (typo.sizeHeading) root.style.setProperty('--size-heading', typo.sizeHeading);
    if (typo.sizeBody)    root.style.setProperty('--size-body',    typo.sizeBody);
    if (typo.colorGold)   root.style.setProperty('--gold',         typo.colorGold);
    if (typo.colorBg)     root.style.setProperty('--bg',           typo.colorBg);
    if (typo.colorText)   root.style.setProperty('--text',         typo.colorText);
  }

  /* ── Fase lunar aproximada ── */
  function lunarPhase() {
    const known = new Date('2000-01-06T18:14:00Z');
    const cycle = 29.530588853;
    const diff = (new Date() - known) / (1000 * 60 * 60 * 24);
    const age = ((diff % cycle) + cycle) % cycle;
    if (age < 1.85) return { emoji: '🌑', name: 'Luna Nueva' };
    if (age < 7.38) return { emoji: '🌒', name: 'Luna Creciente' };
    if (age < 9.22) return { emoji: '🌓', name: 'Cuarto Creciente' };
    if (age < 14.76) return { emoji: '🌔', name: 'Gibosa Creciente' };
    if (age < 16.61) return { emoji: '🌕', name: 'Luna Llena' };
    if (age < 22.15) return { emoji: '🌖', name: 'Gibosa Menguante' };
    if (age < 23.99) return { emoji: '🌗', name: 'Cuarto Menguante' };
    if (age < 29.53) return { emoji: '🌘', name: 'Luna Menguante' };
    return { emoji: '🌑', name: 'Luna Nueva' };
  }

  /* ── Render pantalla de inicio ── */
  function renderHome() {
    const sec = document.getElementById('sec-home');
    if (!sec) return;

    const luna = lunarPhase();
    const portada = lsGet('bruja_portada_url', '');

    sec.innerHTML = `
      <div class="home-portada">
        ${portada
          ? `<img src="${portada}" alt="El Año de la Bruja" onerror="this.parentElement.innerHTML='<div class=home-portada-placeholder><span class=ph-emoji>🌙</span><h1>El Año de la Bruja</h1></div>'">`
          : `<div class="home-portada-placeholder">
               <span class="ph-emoji">🌙</span>
               <h1>El Año de la Bruja</h1>
             </div>`}
      </div>
      <div class="home-info">
        <div class="home-fase">${luna.emoji} ${luna.name}</div>
        <p class="text-muted" style="font-size:.88rem">${today()}</p>
        <div class="home-dash">
          <div class="dash-card" onclick="App.navigate('biblioteca')">
            <span class="dc-emoji">🌿</span>
            <span class="dc-label">Biblioteca</span>
            <span class="dc-value">Hierbas & cristales</span>
          </div>
          <div class="dash-card" onclick="App.navigate('hechizos')">
            <span class="dc-emoji">✨</span>
            <span class="dc-label">Hechizos</span>
            <span class="dc-value">Tu colección</span>
          </div>
          <div class="dash-card" onclick="App.navigate('altar')">
            <span class="dc-emoji">🔥</span>
            <span class="dc-label">Altar</span>
            <span class="dc-value">Por panteón</span>
          </div>
          <div class="dash-card" onclick="App.navigate('diario')">
            <span class="dc-emoji">📖</span>
            <span class="dc-label">Diario</span>
            <span class="dc-value">Grimorio visual</span>
          </div>
        </div>
      </div>`;
  }

  /* ── Inicialización ── */
  function init() {
    applyTypography();
    renderTopbar();
    renderHome();
    navigate('home');
  }

  return {
    init,
    navigate,
    toast,
    openModal,
    closeModal,
    readImgFile,
    lsGet,
    lsSet,
    uid,
    today,
    todayISO,
    lunarPhase,
    renderHome,
    SECTIONS,
  };

})();

</script>

   ============================================================ */

const Admin = (() => {
  const DEFAULT_PIN = 'bruja2024';
  const SESSION_KEY = 'bruja_admin_unlocked';

  let activePanel = null;

  /* ── Autenticación ── */
  function isUnlocked() {
    return sessionStorage.getItem(SESSION_KEY) === '1';
  }

  function unlock(pin) {
    const stored = App.lsGet('bruja_admin_pin', DEFAULT_PIN);
    if (pin === stored) {
      sessionStorage.setItem(SESSION_KEY, '1');
      return true;
    }
    return false;
  }

  /* ── Render principal ── */
  function render() {
    const sec = document.getElementById('sec-admin');
    if (!sec) return;

    if (!isUnlocked()) {
      renderPin(sec);
      return;
    }
    renderDashboard(sec);
  }

  /* ── PIN ── */
  function renderPin(sec) {
    sec.innerHTML = `
      <div class="admin-pin-wrap">
        <span style="font-size:3rem">⚙️</span>
        <h1 class="section-title">Panel Admin</h1>
        <p class="text-muted" style="text-align:center;font-size:.9rem">
          Ingresa el PIN para administrar tu grimorio
        </p>
        <div class="admin-pin-row">
          <input type="password" id="admin-pin-input" class="form-input"
            placeholder="••••••••" maxlength="20" autocomplete="off">
          <button class="btn btn-primary" onclick="Admin._tryPin()">Entrar</button>
        </div>
        <p id="admin-pin-err" style="color:#ff7070;font-size:.82rem;display:none">PIN incorrecto</p>
      </div>`;

    const inp = document.getElementById('admin-pin-input');
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') Admin._tryPin(); });
  }

  function _tryPin() {
    const inp = document.getElementById('admin-pin-input');
    const err = document.getElementById('admin-pin-err');
    if (!inp) return;
    if (unlock(inp.value)) {
      renderDashboard(document.getElementById('sec-admin'));
    } else {
      if (err) { err.style.display = 'block'; }
      inp.value = '';
      inp.focus();
    }
  }

  /* ── Dashboard admin ── */
  function renderDashboard(sec) {
    sec.innerHTML = `
      <h1 class="section-title">⚙️ Panel Admin</h1>
      <p class="section-sub">Motor central de tu grimorio. Todo el contenido se gestiona aquí.</p>

      <div class="admin-menu">
        ${menuBtn('biblioteca',  '🌿', 'Biblioteca')}
        ${menuBtn('taller',      '🕯️', 'Taller de Brujas')}
        ${menuBtn('hechizos',    '✨', 'Hechizos')}
        ${menuBtn('altar',       '🔥', 'Altar & Panteones')}
        ${menuBtn('ancestros',   '👁️', 'Ancestros & Seres')}
        ${menuBtn('rueda',       '☀️', 'Rueda del Año')}
        ${menuBtn('tarot',       '🃏', 'Tarot')}
        ${menuBtn('diario',      '📖', 'Diario')}
        ${menuBtn('generador',   '⭐', 'Generador Hechizos')}
        ${menuBtn('tipografia',  '🔤', 'Tipografía')}
        ${menuBtn('portada',     '📷', 'Portada / Logo')}
        ${menuBtn('pin',         '🔐', 'Cambiar PIN')}
        ${menuBtn('usuarios',    '👥', 'Usuarios')}
      </div>

      <div id="admin-panels">
        <div id="adm-biblioteca" class="admin-panel"></div>
        <div id="adm-taller"     class="admin-panel"></div>
        <div id="adm-hechizos"   class="admin-panel"></div>
        <div id="adm-altar"      class="admin-panel"></div>
        <div id="adm-ancestros"  class="admin-panel"></div>
        <div id="adm-rueda"      class="admin-panel"></div>
        <div id="adm-tarot"      class="admin-panel"></div>
        <div id="adm-diario"     class="admin-panel"></div>
        <div id="adm-generador"  class="admin-panel"></div>
        <div id="adm-tipografia" class="admin-panel"></div>
        <div id="adm-portada"    class="admin-panel"></div>
        <div id="adm-pin"        class="admin-panel"></div>
        <div id="adm-usuarios"   class="admin-panel"></div>
      </div>

      <div style="margin-top:2rem;text-align:center">
        <button class="btn btn-ghost btn-sm" onclick="Admin._logout()">🔒 Cerrar sesión admin</button>
      </div>`;

    if (activePanel) showPanel(activePanel);
  }

  function menuBtn(id, emoji, label) {
    return `<button class="admin-menu-btn ${activePanel === id ? 'active' : ''}"
              onclick="Admin._showPanel('${id}')">
              <span class="amb-emoji">${emoji}</span>${label}
            </button>`;
  }

  function _showPanel(id) {
    activePanel = id;
    // Actualizar botones activos
    document.querySelectorAll('.admin-menu-btn').forEach((b, i) => {
      const bid = b.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
      b.classList.toggle('active', bid === id);
    });
    showPanel(id);
  }

  function showPanel(id) {
    document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
    const panel = document.getElementById('adm-' + id);
    if (!panel) return;
    panel.classList.add('active');

    const renders = {
      biblioteca:  renderAdmBiblioteca,
      taller:      renderAdmTaller,
      hechizos:    renderAdmHechizos,
      altar:       renderAdmAltar,
      ancestros:   renderAdmAncestros,
      rueda:       renderAdmRueda,
      tarot:       renderAdmTarot,
      diario:      renderAdmDiario,
      generador:   renderAdmGenerador,
      tipografia:  renderAdmTipografia,
      portada:     renderAdmPortada,
      pin:         renderAdmPin,
      usuarios:    renderAdmUsuarios,
    };
    if (renders[id]) renders[id](panel);
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

        <label class="form-label">Color fondo (hex)</label>
        <input id="ty-bg" class="form-input" type="color" value="${typo.colorBg || '#07050F'}"
          oninput="Admin._typoPreview()" style="height:44px">
      </div>
      <div class="form-group">
        <label class="form-label">Color texto (hex)</label>
        <input id="ty-text" class="form-input" type="color" value="${typo.colorText || '#F0E8FF'}"
          oninput="Admin._typoPreview()" style="height:44px">
      </div>

      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="Admin._typoGuardar()">💾 Guardar tipografía</button>
        <button class="btn btn-ghost btn-sm" onclick="Admin._typoReset()">↩ Restaurar defaults</button>
      </div>`;
  }

  function _typoPreview() {
    const root = document.documentElement;
    const get = id => document.getElementById(id)?.value;
    const prev = document.getElementById('typo-prev');
    if (prev) {
      const title = prev.querySelector('.typo-prev-title');
      const h2 = prev.querySelector('.typo-prev-h2');
      const body = prev.querySelector('.typo-prev-body');
      if (title) title.style.fontFamily = get('ty-title');
      if (title) title.style.fontSize = get('ty-size-title');
      if (h2) h2.style.fontFamily = get('ty-heading');
      if (body) body.style.fontFamily = get('ty-body');
      if (body) body.style.fontSize = get('ty-size-body');
      if (title) title.style.color = get('ty-gold');
    }
  }

  function _typoGuardar() {
    const get = id => document.getElementById(id)?.value;
    const typo = {
      fontTitle:   get('ty-title'),
      fontHeading: get('ty-heading'),
      fontBody:    get('ty-body'),
      sizeTitle:   get('ty-size-title'),
      sizeBody:    get('ty-size-body'),
      colorGold:   get('ty-gold'),
      colorBg:     get('ty-bg'),
      colorText:   get('ty-text'),
    };
    App.lsSet('bruja_typo', typo);
    App.applyTypography();
    App.toast('Tipografía guardada y aplicada ✓');
  }

  function _typoReset() {
    App.lsSet('bruja_typo', {});
    App.applyTypography();
    App.toast('Tipografía restaurada');
    renderAdmTipografia(document.getElementById('adm-tipografia'));
  }

  /* ══════════════════════════════════════════════
     PORTADA ADMIN
     ══════════════════════════════════════════════ */
  function renderAdmPortada(panel) {
    const url = App.lsGet('bruja_portada_url', '');
    panel.innerHTML = `
      <h2 style="margin-bottom:1rem">📷 Portada</h2>
      <p class="text-muted" style="font-size:.88rem;margin-bottom:1rem">
        Sube la imagen de portada a GitHub y pega la URL aquí.
      </p>
      ${url ? `<img src="${url}" style="max-width:200px;border-radius:var(--radius);margin-bottom:1rem;display:block" alt="Portada">` : ''}
      <div class="form-group">
        <label class="form-label">URL de la portada en GitHub</label>
        <input id="portada-url" class="form-input" value="${url}" placeholder="https://rvgian.github.io/libro-de-sombras/portada.png">
      </div>
      <button class="btn btn-primary" onclick="Admin._portadaGuardar()">💾 Guardar portada</button>`;
  }

  function _portadaGuardar() {
    const url = document.getElementById('portada-url')?.value.trim();
    App.lsSet('bruja_portada_url', url);
    App.toast('Portada actualizada ✓');
    App.renderHome();
    renderAdmPortada(document.getElementById('adm-portada'));
  }

  /* ══════════════════════════════════════════════
     PIN ADMIN
     ══════════════════════════════════════════════ */
  function renderAdmPin(panel) {
    panel.innerHTML = `
      <h2 style="margin-bottom:1rem">🔐 Cambiar PIN</h2>
      <div class="form-group">
        <label class="form-label">PIN actual</label>
        <input id="pin-actual" type="password" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Nuevo PIN</label>
        <input id="pin-nuevo" type="password" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Confirmar nuevo PIN</label>
        <input id="pin-confirm" type="password" class="form-input">
      </div>
      <button class="btn btn-primary" onclick="Admin._cambiarPin()">🔐 Cambiar PIN</button>`;
  }

  function _cambiarPin() {
    const actual = document.getElementById('pin-actual')?.value;
    const nuevo = document.getElementById('pin-nuevo')?.value;
    const confirm = document.getElementById('pin-confirm')?.value;
    const stored = App.lsGet('bruja_admin_pin', DEFAULT_PIN);
    if (actual !== stored) { App.toast('PIN actual incorrecto'); return; }
    if (!nuevo || nuevo.length < 4) { App.toast('El PIN debe tener al menos 4 caracteres'); return; }
    if (nuevo !== confirm) { App.toast('Los PINs no coinciden'); return; }
    App.lsSet('bruja_admin_pin', nuevo);
    App.toast('PIN actualizado ✓');
  }

  /* ══════════════════════════════════════════════
     USUARIOS ADMIN
     ══════════════════════════════════════════════ */
  function renderAdmUsuarios(panel) {
    const usuarios = App.lsGet('bruja_usuarios', []);
    panel.innerHTML = `
      <h2 style="margin-bottom:1rem">👥 Usuarios</h2>
      <p class="text-muted" style="font-size:.88rem;margin-bottom:1rem">
        Los usuarios Lectores pueden ver el grimorio pero no modificar nada.
      </p>
      <button class="btn btn-primary mb-2" onclick="Admin._usuarioNuevo()">+ Agregar usuario</button>
      ${usuarios.length === 0 ? `<div class="empty-state"><span class="es-emoji">👥</span><p>No hay usuarios adicionales</p></div>` : ''}
      ${usuarios.map(u => `
        <div class="admin-item">
          <div class="admin-item-img">👤</div>
          <div class="admin-item-info">
            <div class="admin-item-name">${u.nombre}</div>
            <div class="admin-item-meta">${u.rol === 'admin' ? '⚙️ Administrador' : '👁️ Lector'} · PIN: ****</div>
          </div>
          <div class="admin-item-actions">
            <button class="btn-icon" onclick="Admin._usuarioEliminar('${u.id}')">🗑️</button>
          </div>
        </div>`).join('')}`;
  }

  function _usuarioNuevo() {
    App.openModal('Nuevo usuario', `
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input id="uf-nombre" class="form-input" placeholder="Nombre del usuario">
      </div>
      <div class="form-group">
        <label class="form-label">Rol</label>
        <select id="uf-rol" class="form-select">
          <option value="lector">👁️ Lector (solo lectura)</option>
          <option value="admin">⚙️ Administrador</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">PIN de acceso</label>
        <input id="uf-pin" type="password" class="form-input" placeholder="PIN para este usuario">
      </div>`,
      {
        confirmLabel: 'Crear usuario',
        onConfirm: () => {
          const nombre = document.getElementById('uf-nombre')?.value.trim();
          const pin = document.getElementById('uf-pin')?.value;
          if (!nombre || !pin) { App.toast('Nombre y PIN son obligatorios'); return; }
          const list = App.lsGet('bruja_usuarios', []);
          list.push({ id: App.uid(), nombre, rol: document.getElementById('uf-rol')?.value, pin });
          App.lsSet('bruja_usuarios', list);
          App.toast('Usuario creado ✓');
          renderAdmUsuarios(document.getElementById('adm-usuarios'));
        }
      }
    );
  }

  function _usuarioEliminar(id) {
    if (!confirm('¿Eliminar este usuario?')) return;
    const list = App.lsGet('bruja_usuarios', []).filter(x => x.id !== id);
    App.lsSet('bruja_usuarios', list);
    App.toast('Usuario eliminado');
    renderAdmUsuarios(document.getElementById('adm-usuarios'));
  }

  /* ══════════════════════════════════════════════
     HELPER — Fila de item admin genérico
     ══════════════════════════════════════════════ */
  function admItemRow(item, type) {
    const img = item.img
      ? `<div class="admin-item-img"><img src="${item.img}" alt="" onerror="this.style.display='none'"></div>`
      : `<div class="admin-item-img">${item.emoji || '✨'}</div>`;

    const editFn = {
      bib:         `Admin._bibNuevo('${item.id}')`,
      hechizo:     `Admin._hechizoNuevo('${item.id}')`,
      panteon:     `Admin._panteonNuevo('${item.id}')`,
      ancestro:    `Admin._ancestroNuevo('${item.id}')`,
      sabat:       `Admin._sabatNuevo('${item.id}')`,
    }[type] || '';

    const deleteFn = {
      bib:      `Admin._admEliminar('bruja_biblioteca', '${item.id}', 'adm-biblioteca', Admin.renderAdmBiblioteca)`,
      hechizo:  `Admin._admEliminar('bruja_hechizos', '${item.id}', 'adm-hechizos', Admin.renderAdmHechizos)`,
      panteon:  `Admin._admEliminar('bruja_panteones', '${item.id}', 'adm-altar', Admin.renderAdmAltar)`,
      ancestro: `Admin._admEliminar('bruja_ancestros', '${item.id}', 'adm-ancestros', Admin.renderAdmAncestros)`,
      sabat:    `Admin._sabatEliminar('${item.id}')`,
    }[type] || '';

    // Detectar tipo taller
    if (type.startsWith('taller-')) {
      const key = type.replace('taller-', '');
      return `<div class="admin-item">${img}
        <div class="admin-item-info">
          <div class="admin-item-name">${item.name}</div>
          <div class="admin-item-meta">${item.proposito || ''}</div>
        </div>
        <div class="admin-item-actions">
          <button class="btn-icon" onclick="Admin._tallerNuevo('${key}','${item.id}')">✏️</button>
          <button class="btn-icon" onclick="Admin._admEliminar('bruja_taller_${key}','${item.id}',null,()=>Admin._tallerTab('${key}',document.querySelector('#adm-taller .tab-btn.active')))">🗑️</button>
        </div></div>`;
    }

    return `<div class="admin-item">${img}
      <div class="admin-item-info">
        <div class="admin-item-name">${item.name}</div>
        <div class="admin-item-meta">${item.tipo || item.rel || item.intencion || item.fecha_n || ''}</div>
      </div>
      <div class="admin-item-actions">
        ${editFn ? `<button class="btn-icon" onclick="${editFn}">✏️</button>` : ''}
        ${deleteFn ? `<button class="btn-icon" onclick="${deleteFn}">🗑️</button>` : ''}
      </div></div>`;
  }

  function _admEliminar(lsKey, id, panelId, rerender) {
    if (!confirm('¿Eliminar este elemento?')) return;
    const list = App.lsGet(lsKey, []).filter(x => x.id !== id);
    App.lsSet(lsKey, list);
    App.toast('Eliminado');
    if (panelId && rerender) {
      const panel = document.getElementById(panelId);
      if (panel) rerender(panel);
    } else if (typeof rerender === 'function') {
      rerender();
    }
  }

  function _sabatEliminar(id) {
    const list = App.lsGet('bruja_sabats', getDefaultSabats()).filter(x => x.id !== id);
    App.lsSet('bruja_sabats', list);
    App.toast('Festividad eliminada');
    renderAdmSabats();
  }

  function _logout() {
    sessionStorage.removeItem(SESSION_KEY);
    App.toast('Sesión admin cerrada');
    App.navigate('home');
    activePanel = null;
  }

  /* ── Exponer funciones necesarias globalmente (para onclick) ── */
  return {
    render, _tryPin, _showPanel,
    _bibNuevo, _tallerNuevo, _tallerTab,
    _hechizoNuevo, _panteonNuevo, _ancestroNuevo,
    _sabatNuevo, _sabatEliminar,
    _tarotGuardarImg, _tarotLimpiar,
    _diarioLimpiar,
    _genVelaNueva, _genVelaEliminar,
    _genIntencionNueva, _genIntencionEliminar,
    _typoPreview, _typoGuardar, _typoReset,
    _portadaGuardar, _cambiarPin,
    _usuarioNuevo, _usuarioEliminar,
    _admEliminar,
    _logout,
    renderAdmBiblioteca, renderAdmHechizos, renderAdmAltar, renderAdmAncestros,
    getDefaultSabats, getDefaultVelas, getDefaultIntenciones,
    isUnlocked,
  };

})();

</script>

/* ============================================================
   BIBLIOTECA.JS — Hierbas, cristales y más
   Contenido gestionado 100% desde Admin
   ============================================================ */

const Biblioteca = (() => {
  let activeItem = null;

  function render() {
    const sec = document.getElementById('sec-biblioteca');
    if (!sec) return;

    const items = App.lsGet('bruja_biblioteca', []);

    sec.innerHTML = `
      <h1 class="section-title">🌿 Biblioteca Mágica</h1>
      <p class="section-sub">Tu colección de hierbas, cristales y elementos. Gestiona todo desde el panel Admin.</p>

      <div class="tabs mb-2" id="bib-filtro-tabs">
        <button class="tab-btn active" onclick="Biblioteca._filtrar('', this)">Todo</button>
        <button class="tab-btn" onclick="Biblioteca._filtrar('hierba', this)">🌿 Hierbas</button>
        <button class="tab-btn" onclick="Biblioteca._filtrar('cristal', this)">💎 Cristales</button>
        <button class="tab-btn" onclick="Biblioteca._filtrar('aceite', this)">🫙 Aceites</button>
        <button class="tab-btn" onclick="Biblioteca._filtrar('otro', this)">✨ Otros</button>
      </div>

      <div class="form-group mb-2">
        <input id="bib-search" class="form-input" placeholder="🔍 Buscar elemento…"
          oninput="Biblioteca._buscar(this.value)">
      </div>

      <div id="bib-detalle" class="bib-detail hidden"></div>
      <div id="bib-grid" class="bib-grid"></div>

      ${items.length === 0 ? `
        <div class="empty-state">
          <span class="es-emoji">🌱</span>
          <p>Tu biblioteca está vacía. ¡Comienza agregando hierbas y cristales desde el panel Admin!</p>
          ${Admin.isUnlocked() ? `<button class="btn btn-ghost" onclick="App.navigate('admin');Admin._showPanel('biblioteca')">Ir a Admin</button>` : ''}
        </div>` : ''}`;

    renderGrid(items);
  }

  function renderGrid(items) {
    const grid = document.getElementById('bib-grid');
    if (!grid) return;

    if (items.length === 0) { grid.innerHTML = ''; return; }

    const tipoEmoji = { hierba: '🌿', cristal: '💎', aceite: '🫙', otro: '✨' };

    grid.innerHTML = items.map(it => `
      <div class="bib-card" onclick="Biblioteca._ver('${it.id}')">
        ${it.img
          ? `<img class="bib-card-img" src="${it.img}" alt="${it.name}"
              onerror="this.outerHTML='<div class=bib-card-img-ph>${tipoEmoji[it.tipo]||'✨'}</div>'">`
          : `<div class="bib-card-img-ph">${tipoEmoji[it.tipo] || '✨'}</div>`}
        <div class="bib-card-body">
          <div class="bib-card-name">${it.name}</div>
          <div class="bib-card-tags">
            ${it.tipo ? `<span class="bib-tag">${tipoEmoji[it.tipo] || ''} ${it.tipo}</span>` : ''}
          </div>
        </div>
      </div>`).join('');
  }

  function _filtrar(tipo, btn) {
    document.querySelectorAll('#bib-filtro-tabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const items = App.lsGet('bruja_biblioteca', []);
    renderGrid(tipo ? items.filter(i => i.tipo === tipo) : items);
    _cerrarDetalle();
  }

  function _buscar(query) {
    const q = query.toLowerCase().trim();
    const items = App.lsGet('bruja_biblioteca', []);
    renderGrid(q ? items.filter(i =>
      i.name.toLowerCase().includes(q) ||
      (i.medicinal || '').toLowerCase().includes(q) ||
      (i.magica || '').toLowerCase().includes(q)
    ) : items);
  }

  function _ver(id) {
    const items = App.lsGet('bruja_biblioteca', []);
    const it = items.find(x => x.id === id);
    if (!it) return;
    activeItem = id;

    const detalle = document.getElementById('bib-detalle');
    if (!detalle) return;
    detalle.classList.remove('hidden');

    detalle.innerHTML = `
      ${it.img ? `<img class="bib-detail-img" src="${it.img}" alt="${it.name}"
        onerror="this.style.display='none'">` : ''}
      <div class="flex-between mb-1">
        <h2>${it.name}</h2>
        <button class="btn-icon" onclick="Biblioteca._cerrarDetalle()">✕</button>
      </div>
      ${it.tipo ? `<span class="badge badge-gold">${it.tipo}</span>` : ''}
      <hr class="section-divider">
      ${prop('💊 Función Medicinal', it.medicinal)}
      ${prop('🌙 Función Mágica', it.magica)}
      ${prop('📋 Usos', it.usos)}
      ${prop('🔄 Sustitutos', it.sustitutos)}
      ${Admin.isUnlocked() ? `
        <div style="margin-top:1rem;display:flex;gap:.5rem">
          <button class="btn btn-ghost btn-sm" onclick="Admin._bibNuevo('${it.id}');App.navigate('admin');Admin._showPanel('biblioteca')">✏️ Editar</button>
        </div>` : ''}`;

    detalle.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function prop(label, value) {
    if (!value) return '';
    return `<div class="bib-prop">
      <div class="bib-prop-label">${label}</div>
      <div class="bib-prop-value">${value.replace(/\n/g, '<br>')}</div>
    </div>`;
  }

  function _cerrarDetalle() {
    const d = document.getElementById('bib-detalle');
    if (d) { d.classList.add('hidden'); d.innerHTML = ''; }
    activeItem = null;
  }

  return { render, _filtrar, _buscar, _ver, _cerrarDetalle };
})();

</script>

/* ============================================================
   TALLER.JS — Taller de Brujas
   Velas, aceites, tinturas, incienso, cocina mágica
   ============================================================ */

const Taller = (() => {
  const CATEGORIAS = [
    { key: 'velas',    label: 'Velas',         emoji: '🕯️', desc: 'Creación y carga de velas mágicas' },
    { key: 'aceites',  label: 'Aceites',        emoji: '🫙', desc: 'Aceites esenciales y mezclas' },
    { key: 'tinturas', label: 'Tinturas',       emoji: '🧪', desc: 'Infusiones y tinturas herbales' },
    { key: 'incienso', label: 'Incienso',       emoji: '💨', desc: 'Mezclas de incienso y sahumerio' },
    { key: 'cocina',   label: 'Cocina Mágica',  emoji: '🍵', desc: 'Recetas con intención' },
  ];

  let catActiva = 'velas';

  function render() {
    const sec = document.getElementById('sec-taller');
    if (!sec) return;

    sec.innerHTML = `
      <h1 class="section-title">🕯️ Taller de Brujas</h1>
      <p class="section-sub">Recetas, preparaciones y creaciones mágicas de tu práctica.</p>

      <div class="tabs" id="taller-tabs">
        ${CATEGORIAS.map((c, i) =>
          `<button class="tab-btn ${c.key === catActiva ? 'active' : ''}"
            onclick="Taller._tab('${c.key}', this)">${c.emoji} ${c.label}</button>`
        ).join('')}
      </div>

      <div id="taller-content"></div>`;

    renderCat(catActiva);
  }

  function _tab(key, btn) {
    catActiva = key;
    document.querySelectorAll('#taller-tabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCat(key);
  }

  function renderCat(key) {
    const content = document.getElementById('taller-content');
    if (!content) return;

    const cat = CATEGORIAS.find(c => c.key === key);
    const items = App.lsGet('bruja_taller_' + key, []);

    content.innerHTML = `
      <p class="text-muted mb-2" style="font-size:.88rem">${cat?.desc || ''}</p>
      ${items.length === 0
        ? `<div class="empty-state">
            <span class="es-emoji">${cat?.emoji || '🕯️'}</span>
            <p>Aún no hay recetas de ${cat?.label || key}. Agrégalas desde Admin.</p>
            ${Admin.isUnlocked() ? `<button class="btn btn-ghost btn-sm" onclick="App.navigate('admin');Admin._showPanel('taller')">Ir a Admin</button>` : ''}
          </div>`
        : items.map(it => recetaCard(it)).join('')}`;
  }

  function recetaCard(it) {
    return `
      <div class="card" style="cursor:pointer" onclick="Taller._toggle('${it.id}')">
        <div class="flex-between">
          <div class="card-title">
            ${it.img ? `<img src="${it.img}" style="width:32px;height:32px;border-radius:6px;object-fit:cover"
              onerror="this.style.display='none'"> ` : ''}
            ${it.name}
          </div>
          <span style="color:var(--muted);font-size:.8rem">▼</span>
        </div>
        ${it.proposito ? `<div style="font-size:.8rem;color:var(--muted)">✨ ${it.proposito}</div>` : ''}
        <div id="taller-det-${it.id}" style="display:none">
          <hr class="section-divider">
          ${it.desc ? `<p style="font-size:.9rem;color:var(--lavender)">${it.desc}</p>` : ''}
          ${it.ingredientes ? `
            <div class="bib-prop">
              <div class="bib-prop-label">🌿 Ingredientes / Materiales</div>
              <div class="bib-prop-value">${it.ingredientes.replace(/\n/g,'<br>')}</div>
            </div>` : ''}
          ${it.preparacion ? `
            <div class="bib-prop">
              <div class="bib-prop-label">📋 Preparación</div>
              <div class="bib-prop-value">${it.preparacion.replace(/\n/g,'<br>')}</div>
            </div>` : ''}
        </div>
      </div>`;
  }

  function _toggle(id) {
    const det = document.getElementById('taller-det-' + id);
    if (det) det.style.display = det.style.display === 'none' ? 'block' : 'none';
  }

  return { render, _tab, _toggle };
})();

</script>

          <div class="gen-mini-title">✨ Sugeridor rápido</div>
          <div class="gen-mini-row">
            <input id="gen-intencion" class="form-input" placeholder="Escribe tu intención…">
            <button class="btn btn-primary btn-sm" onclick="Hechizos._generar()">Sugerir</button>
          </div>
          <div id="gen-resultado" style="margin-top:.6rem;display:none"></div>
        </div>

        <!-- Búsqueda -->
        <div style="margin-bottom:1rem">
          <input id="hechizo-search" class="form-input" placeholder="🔍 Buscar hechizos…"
            oninput="Hechizos._buscar(this.value)">
        </div>

        <div id="hechizos-list">
          ${renderBiblioteca()}
        </div>
      </div>

      <!-- PESTAÑA: GENERADOR -->
      <div id="hech-generador" class="tab-panel">
        ${renderGenerador()}
      </div>`;
  }

  function renderBiblioteca() {
    const items = App.lsGet('bruja_hechizos', []);
    if (items.length === 0) {
      return `<div class="empty-state">
        <span class="es-emoji">✨</span>
        <p>Tu biblioteca de hechizos está vacía. Comienza agregando desde Admin.</p>
        ${Admin.isUnlocked() ? `<button class="btn btn-ghost" onclick="App.navigate('admin');Admin._showPanel('hechizos')">Ir a Admin</button>` : ''}
       </div>`;
    }
    return items.map(hechizoCard).join('');
  }

  function renderGenerador() {
    const intenciones = App.lsGet('bruja_gen_intenciones', Admin.getDefaultIntenciones());
    const velas = App.lsGet('bruja_gen_velas', Admin.getDefaultVelas());
    const hierbas = App.lsGet('bruja_biblioteca', []).filter(b => b.tipo === 'hierba' || !b.tipo || b.tipo === 'planta');

    const diasSemana = [
      { d: 'lunes',    em: '🌙', ast: 'Luna',    para: 'intuición, emociones, sueños' },
      { d: 'martes',   em: '🔥', ast: 'Marte',   para: 'protección, coraje, fuerza' },
      { d: 'miércoles',em: '💨', ast: 'Mercurio', para: 'comunicación, viajes, magia' },
      { d: 'jueves',   em: '⚡', ast: 'Júpiter',  para: 'abundancia, expansión, suerte' },
      { d: 'viernes',  em: '💚', ast: 'Venus',    para: 'amor, belleza, armonía' },
      { d: 'sábado',   em: '🪐', ast: 'Saturno',  para: 'protección, límites, trabajo' },
      { d: 'domingo',  em: '☀️', ast: 'Sol',      para: 'éxito, liderazgo, claridad' },
    ];

    const lunas = [
      { key: 'nueva',     em: '🌑', label: 'Luna Nueva',     para: 'nuevos inicios, semillas, intenciones' },
      { key: 'creciente', em: '🌒', label: 'Luna Creciente', para: 'crecimiento, atracción, manifestación' },
      { key: 'llena',     em: '🌕', label: 'Luna Llena',     para: 'plenitud, magia de máxima potencia' },
      { key: 'menguante', em: '🌘', label: 'Luna Menguante', para: 'liberación, destierro, soltar' },
    ];

    return `
      <div class="card mb-2">
        <div class="card-title">🔮 Crear Ritual Personalizado</div>
        <p style="font-size:.85rem;color:var(--muted)">Selecciona los componentes y genera una guía de ritual.</p>
      </div>

      <!-- Intención -->
      <div class="form-group">
        <label class="form-label">✨ Intención principal</label>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem" id="gen-int-buttons">
          ${intenciones.map(i => `
            <button class="btn btn-ghost btn-sm gen-selector" data-group="intencion" data-val="${i.name}"
              onclick="Hechizos._selGen(this, 'intencion')">
              ${i.emoji || '✨'} ${i.name}
            </button>`).join('')}
        </div>
        <input id="gen-intencion-custom" class="form-input" placeholder="O escribe tu propia intención…">
      </div>

      <!-- Día de la semana -->
      <div class="form-group">
        <label class="form-label">📅 Día de trabajo (opcional)</label>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          ${diasSemana.map(d => `
            <button class="btn btn-ghost btn-sm gen-selector" data-group="dia" data-val="${d.d}"
              title="${d.para}" onclick="Hechizos._selGen(this, 'dia')">
              ${d.em} ${d.d.charAt(0).toUpperCase()+d.d.slice(1)}
            </button>`).join('')}
        </div>
      </div>

      <!-- Luna -->
      <div class="form-group">
        <label class="form-label">🌙 Fase lunar (opcional)</label>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          ${lunas.map(l => `
            <button class="btn btn-ghost btn-sm gen-selector" data-group="luna" data-val="${l.key}"
              title="${l.para}" onclick="Hechizos._selGen(this, 'luna')">
              ${l.em} ${l.label}
            </button>`).join('')}
        </div>
      </div>

      <!-- Vela -->
      <div class="form-group">
        <label class="form-label">🕯️ Color de vela (opcional)</label>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          ${velas.map(v => `
            <button class="btn btn-ghost btn-sm gen-selector" data-group="vela" data-val="${v.name}"
              title="${v.significado||''}" onclick="Hechizos._selGen(this, 'vela')">
              ${v.emoji || '🕯️'} ${v.name}
            </button>`).join('')}
        </div>
      </div>

      <!-- Hierba/elemento -->
      ${hierbas.length > 0 ? `
      <div class="form-group">
        <label class="form-label">🌿 Hierba o elemento de tu biblioteca (opcional)</label>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          ${hierbas.slice(0, 12).map(h => `
            <button class="btn btn-ghost btn-sm gen-selector" data-group="hierba" data-val="${h.name}"
              onclick="Hechizos._selGen(this, 'hierba')">
              🌿 ${h.name}
            </button>`).join('')}
        </div>
      </div>` : ''}

      <!-- Detalles adicionales -->
      <div class="form-group">
        <label class="form-label">📝 Notas personales (opcional)</label>
        <textarea id="gen-notas" class="form-textarea" style="min-height:70px"
          placeholder="Escribe algo adicional: a quién va dirigido, qué deseas lograr en detalle…"></textarea>
      </div>

      <div style="display:flex;gap:.5rem">
        <button class="btn btn-primary" onclick="Hechizos._generarRitual()">🔮 Generar Ritual</button>
        <button class="btn btn-ghost btn-sm" onclick="Hechizos._limpiarGen()">↺ Limpiar</button>
      </div>

      <div id="gen-ritual-resultado" style="margin-top:1.5rem"></div>`;
  }

  // Estado del generador
  const selecciones = { intencion: null, dia: null, luna: null, vela: null, hierba: null };

  function _selGen(btn, grupo) {
    const val = btn.dataset.val;
    if (selecciones[grupo] === val) {
      // Deseleccionar
      selecciones[grupo] = null;
      btn.classList.remove('active');
    } else {
      selecciones[grupo] = val;
      document.querySelectorAll(`[data-group="${grupo}"]`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  }

  function _limpiarGen() {
    Object.keys(selecciones).forEach(k => selecciones[k] = null);
    document.querySelectorAll('.gen-selector').forEach(b => b.classList.remove('active'));
    const notas = document.getElementById('gen-notas');
    const inp = document.getElementById('gen-intencion-custom');
    if (notas) notas.value = '';
    if (inp) inp.value = '';
    const res = document.getElementById('gen-ritual-resultado');
    if (res) res.innerHTML = '';
  }

  function _generarRitual() {
    const intencionCustom = document.getElementById('gen-intencion-custom')?.value.trim();
    const notas = document.getElementById('gen-notas')?.value.trim();
    const intencion = intencionCustom || selecciones.intencion;

    if (!intencion) {
      App.toast('Selecciona o escribe una intención primero ✨');
      return;
    }

    const diasData = {
      lunes: { ast: 'Luna', color: 'plateado', para: 'intuición y emociones' },
      martes: { ast: 'Marte', color: 'rojo', para: 'protección y fuerza' },
      miércoles: { ast: 'Mercurio', color: 'amarillo', para: 'comunicación y claridad' },
      jueves: { ast: 'Júpiter', color: 'verde o morado', para: 'abundancia y expansión' },
      viernes: { ast: 'Venus', color: 'rosa o verde', para: 'amor y armonía' },
      sábado: { ast: 'Saturno', color: 'negro o morado', para: 'protección y límites' },
      domingo: { ast: 'Sol', color: 'dorado o amarillo', para: 'éxito y claridad' },
    };

    const lunasData = {
      nueva: 'Esta fase es perfecta para sembrar intenciones y hacer peticiones nuevas. La energía está en su punto cero, lista para crecer.',
      creciente: 'La energía está en expansión. Ideal para atraer, crecer y manifestar. Tu intención tiene más fuerza mientras la luna crece.',
      llena: 'La luna está en su máxima potencia. Haz este ritual durante las horas de más luz lunar para mayor efecto.',
      menguante: 'Tiempo de soltar, limpiar y liberar. Usa esta energía para desterrar lo que ya no sirve.',
    };

    const diaInfo = selecciones.dia ? diasData[selecciones.dia] : null;
    const lunaInfo = selecciones.luna ? lunasData[selecciones.luna] : null;
    const vela = selecciones.vela;
    const hierba = selecciones.hierba;

    // Pasos del ritual
    const pasos = [];

    pasos.push(`Elige un momento de quietud. Apaga el teléfono y crea un espacio libre de interrupciones.`);
    pasos.push(`Limpia el espacio con humo de salvia, palo santo o agua con sal. Muévete en sentido de las agujas del reloj.`);

    if (selecciones.dia) {
      pasos.push(`Trabaja este ritual un ${selecciones.dia}, día regido por ${diaInfo.ast}, especialmente poderoso para ${diaInfo.para}.`);
    }

    if (vela) {
      const velas = App.lsGet('bruja_gen_velas', Admin.getDefaultVelas());
      const velaObj = velas.find(v => v.name === vela);
      pasos.push(`Enciende una vela ${vela}${velaObj?.significado ? ` — ${velaObj.significado}` : ''}. Mientras la enciendes, visualiza tu intención con claridad.`);
    } else {
      pasos.push(`Enciende una vela blanca (sirve para cualquier intención). Visualiza tu intención mientras la enciendes.`);
    }

    if (hierba) {
      const biblioteca = App.lsGet('bruja_biblioteca', []);
      const hObj = biblioteca.find(b => b.name === hierba);
      pasos.push(`Coloca ${hierba} en tu espacio${hObj?.magica ? ` — se usa para ${hObj.magica}` : ''}. Puedes ponerla alrededor de la vela, en un cuenco o sostenerla mientras trabajas.`);
    }

    pasos.push(`Escribe tu intención en papel en tiempo presente y positivo: "Yo soy…", "Yo tengo…", "Yo atraigo…"`);
    pasos.push(`Lee tu intención en voz alta tres veces con convicción. Siente la energía de lo que ya se está manifestando.`);
    pasos.push(`Medita o siéntate en silencio por al menos 5 minutos visualizando tu intención cumplida. Percibe cómo te sientes cuando ya ocurrió.`);

    if (notas) {
      pasos.push(`Instrucción personal: ${notas}`);
    }

    pasos.push(`Cierra el ritual agradeciendo a las energías que te acompañaron. Puedes decir: "Que así sea, que así es, que así ha sido."`);
    pasos.push(`Deja la vela consumirse sola si es seguro, o apágala con tus dedos (nunca soplarla). Guarda el papel escrito en un lugar significativo.`);

    if (lunaInfo) {
      // Agregar nota de luna al inicio
    }

    // Buscar hechizos de la biblioteca que coincidan
    const hechizos = App.lsGet('bruja_hechizos', []);
    const relacionados = hechizos.filter(h =>
      (h.intencion || '').toLowerCase().includes(intencion.toLowerCase()) ||
      intencion.toLowerCase().includes((h.intencion || '').toLowerCase().split(' ')[0])
    ).slice(0, 2);

    const res = document.getElementById('gen-ritual-resultado');
    if (!res) return;

    res.innerHTML = `
      <div class="card" style="border:1px solid var(--gold);background:linear-gradient(135deg,var(--bg2),var(--bg3))">
        <div class="card-title" style="font-size:1.1rem">✨ Ritual: ${intencion}</div>
        ${selecciones.luna ? `
          <div style="font-size:.82rem;color:var(--gold-l);margin-bottom:.75rem;padding:.5rem;background:rgba(196,151,42,.1);border-radius:var(--radius-s)">
            ${selecciones.luna === 'nueva' ? '🌑' : selecciones.luna === 'creciente' ? '🌒' : selecciones.luna === 'llena' ? '🌕' : '🌘'}
            <em>${lunaInfo}</em>
          </div>` : ''}

        <ol style="padding-left:1.3rem;margin:0">
          ${pasos.map(p => `<li style="font-size:.9rem;color:var(--text);line-height:1.75;margin-bottom:.4rem">${p}</li>`).join('')}
        </ol>

        ${relacionados.length > 0 ? `
          <div style="margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--border)">
            <div style="font-size:.82rem;color:var(--gold-l);margin-bottom:.5rem">📚 Hechizos de tu biblioteca relacionados:</div>
            ${relacionados.map(h => `
              <div style="font-size:.85rem;padding:.3rem 0;cursor:pointer;border-bottom:1px solid var(--border)"
                onclick="Hechizos._ver('${h.id}')">
                ${h.emoji || '✨'} <strong>${h.name}</strong>
                ${h.intencion ? `<span style="color:var(--muted)"> — ${h.intencion}</span>` : ''}
              </div>`).join('')}
          </div>` : ''}

        <div style="display:flex;gap:.5rem;margin-top:1rem">
          <button class="btn btn-ghost btn-sm" onclick="Hechizos._guardarRitual()">💾 Guardar como hechizo</button>
        </div>
      </div>`;

    // Guardar temporalmente para poder guardar después
    res._ritualData = { intencion, pasos, dia: selecciones.dia, luna: selecciones.luna, vela, hierba };
  }

  function _guardarRitual() {
    const res = document.getElementById('gen-ritual-resultado');
    if (!res || !res._ritualData) return;
    const r = res._ritualData;

    App.openModal('Guardar ritual en biblioteca', `
      <div class="form-group">
        <label class="form-label">Nombre del hechizo</label>
        <input id="grit-nombre" class="form-input" value="Ritual de ${r.intencion}">
      </div>
      <div class="form-group">
        <label class="form-label">Emoji (opcional)</label>
        <input id="grit-emoji" class="form-input" value="🔮" style="width:80px">
      </div>`,
      {
        confirmLabel: 'Guardar',
        onConfirm: () => {
          const nombre = document.getElementById('grit-nombre')?.value.trim() || 'Ritual generado';
          const emoji = document.getElementById('grit-emoji')?.value.trim() || '🔮';
          const hechizos = App.lsGet('bruja_hechizos', []);
          hechizos.unshift({
            id: App.uid(),
            name: nombre,
            emoji,
            intencion: r.intencion,
            luna: r.luna || '',
            materiales: [
              r.vela ? `Vela ${r.vela}` : 'Vela blanca',
              r.hierba ? `${r.hierba}` : '',
              'Papel y bolígrafo',
              'Incienso de tu elección'
            ].filter(Boolean).join('\n'),
            procedimiento: r.pasos.map((p, i) => `${i+1}. ${p}`).join('\n'),
            notas: r.dia ? `Día recomendado: ${r.dia}` : '',
          });
          App.lsSet('bruja_hechizos', hechizos);
          App.toast('Ritual guardado en tu biblioteca ✨');
        }
      }
    );
  }

  function hechizoCard(it) {
    const lunaMap = { nueva:'🌑', creciente:'🌒', llena:'🌕', menguante:'🌘' };
    return `
      <div class="hechizo-card" onclick="Hechizos._ver('${it.id}')">
        <div class="hechizo-card-header">
          <span class="hechizo-emoji">${it.emoji || '✨'}</span>
          <div class="hechizo-info">
            <h3>${it.name}</h3>
            <div class="hechizo-meta">
              ${it.intencion ? `✨ ${it.intencion}` : ''}
              ${it.panteon ? ` · ${it.panteon}` : ''}
              ${it.luna ? ` · ${lunaMap[it.luna] || ''} ${it.luna}` : ''}
            </div>
          </div>
        </div>
      </div>`;
  }

  function _ver(id) {
    const items = App.lsGet('bruja_hechizos', []);
    const it = items.find(x => x.id === id);
    if (!it) return;
    const lunaMap = { nueva:'🌑 Luna Nueva', creciente:'🌒 Luna Creciente', llena:'🌕 Luna Llena', menguante:'🌘 Luna Menguante' };

    App.openModal(it.name, `
      <div style="text-align:center;font-size:3rem;margin-bottom:.75rem">${it.emoji || '✨'}</div>
      ${it.intencion ? `<p><strong>Intención:</strong> ${it.intencion}</p>` : ''}
      ${it.panteon ? `<p><strong>Panteón:</strong> ${it.panteon}</p>` : ''}
      ${it.luna ? `<p><strong>Luna ideal:</strong> ${lunaMap[it.luna] || it.luna}</p>` : ''}
      ${it.materiales ? `
        <div class="bib-prop mt-2">
          <div class="bib-prop-label">🌿 Materiales</div>
          <div class="bib-prop-value">${it.materiales.replace(/\n/g,'<br>')}</div>
        </div>` : ''}
      ${it.procedimiento ? `
        <div class="bib-prop mt-2">
          <div class="bib-prop-label">📋 Procedimiento</div>
          <div class="bib-prop-value">${it.procedimiento.replace(/\n/g,'<br>')}</div>
        </div>` : ''}
      ${it.notas ? `
        <div class="bib-prop mt-2">
          <div class="bib-prop-label">📝 Notas</div>
          <div class="bib-prop-value">${it.notas}</div>
        </div>` : ''}`,
      { showCancel: false, confirmLabel: 'Cerrar', onConfirm: () => {} }
    );
  }

  function _tab(key, btn) {
    document.querySelectorAll('#hech-tabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('#sec-hechizos .tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('hech-' + key)?.classList.add('active');
  }

  function _buscar(q) {
    const query = q.toLowerCase().trim();
    const items = App.lsGet('bruja_hechizos', []);
    const list = document.getElementById('hechizos-list');
    if (!list) return;
    const filtered = query ? items.filter(i =>
      i.name.toLowerCase().includes(query) ||
      (i.intencion || '').toLowerCase().includes(query) ||
      (i.panteon || '').toLowerCase().includes(query)
    ) : items;
    list.innerHTML = filtered.length === 0
      ? '<p class="text-muted text-center mt-2">Sin resultados</p>'
      : filtered.map(hechizoCard).join('');
  }

  function _generar() {
    const intencionInput = document.getElementById('gen-intencion');
    const resultado = document.getElementById('gen-resultado');
    if (!intencionInput || !resultado) return;

    const q = intencionInput.value.toLowerCase().trim();
    if (!q) { App.toast('Escribe una intención primero'); return; }

    const items = App.lsGet('bruja_hechizos', []);
    const matches = items.filter(i =>
      (i.intencion || '').toLowerCase().includes(q) ||
      i.name.toLowerCase().includes(q) ||
      (i.notas || '').toLowerCase().includes(q)
    );

    const velas = App.lsGet('bruja_gen_velas', Admin.getDefaultVelas());
    const velaMatch = velas.filter(v =>
      (v.significado || '').toLowerCase().includes(q) ||
      v.name.toLowerCase().includes(q)
    );

    resultado.style.display = 'block';
    resultado.innerHTML = `
      <hr class="section-divider" style="margin:.5rem 0">
      ${matches.length > 0
        ? `<p style="font-size:.82rem;color:var(--gold-l)">✨ Hechizos con "${q}":</p>
           ${matches.slice(0, 3).map(it => `
             <div style="font-size:.82rem;padding:.3rem 0;border-bottom:1px solid var(--border);cursor:pointer"
               onclick="Hechizos._ver('${it.id}')">
               ${it.emoji || '✨'} <strong>${it.name}</strong>
               ${it.intencion ? `<span style="color:var(--muted)"> — ${it.intencion}</span>` : ''}
             </div>`).join('')}`
        : `<p style="font-size:.82rem;color:var(--muted)">No encontré hechizos con esa intención aún.</p>`}
      ${velaMatch.length > 0
        ? `<p style="font-size:.82rem;color:var(--gold-l);margin-top:.5rem">🕯️ Velas: ${velaMatch.map(v=>v.emoji+' '+v.name).join(', ')}</p>`
        : ''}
      <p style="font-size:.78rem;color:var(--muted);margin-top:.5rem;cursor:pointer"
        onclick="Hechizos._tab('generador', document.querySelector('#hech-tabs .tab-btn:last-child'))">
        → Ir al Generador de Rituales completo
      </p>`;
  }

  return { render, _tab, _ver, _buscar, _generar, _selGen, _generarRitual, _limpiarGen, _guardarRitual };
})();

</script>
  <script>
/* ============================================================
   ALTAR.JS — Altar por panteones
   ============================================================ */

const Altar = (() => {
  let panteonActivo = null;

  function render() {
    const sec = document.getElementById('sec-altar');
    if (!sec) return;

    const panteones = App.lsGet('bruja_panteones', []);

    sec.innerHTML = `
      <h1 class="section-title">🔥 Altar</h1>
      <p class="section-sub">Tu altar sagrado organizado por panteón y tradición.</p>

      ${panteones.length === 0
        ? `<div class="empty-state">
            <span class="es-emoji">🔥</span>
            <p>Tu altar está vacío. Agrega panteones desde el panel Admin.</p>
            ${Admin.isUnlocked() ? `<button class="btn btn-ghost" onclick="App.navigate('admin');Admin._showPanel('altar')">Ir a Admin</button>` : ''}
           </div>`
        : `<div class="panteones-grid" id="panteones-grid">
            ${panteones.map(p => panteonCard(p)).join('')}
           </div>
           <div id="altar-detalle" class="altar-detail ${panteonActivo ? 'visible' : ''}"></div>`}`;

    if (panteonActivo) {
      const p = panteones.find(x => x.id === panteonActivo);
      if (p) renderDetalle(p);
    }
  }

  function panteonCard(p) {
    return `
      <div class="panteон-card ${panteonActivo === p.id ? 'active' : ''}"
        onclick="Altar._seleccionar('${p.id}')">
        ${p.img
          ? `<img class="panteон-img" src="${p.img}" alt="${p.name}"
              onerror="this.outerHTML='<div class=panteон-img-ph>🔥</div>'">`
          : `<div class="panteон-img-ph">🔥</div>`}
        <div class="panteон-name">${p.name}</div>
      </div>`;
  }

  function _seleccionar(id) {
    panteonActivo = panteonActivo === id ? null : id;
    // Actualizar activos
    document.querySelectorAll('.panteон-card').forEach((c, i) => {
      const pid = c.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
      c.classList.toggle('active', pid === panteonActivo);
    });

    const detalle = document.getElementById('altar-detalle');
    if (!detalle) return;

    if (!panteonActivo) {
      detalle.classList.remove('visible');
      detalle.innerHTML = '';
      return;

    const panteones = App.lsGet('bruja_panteones', []);
    const p = panteones.find(x => x.id === panteonActivo);

      detalle.classList.add('visible');
      renderDetalle(p);
      detalle.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
